<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>第三回ブロスタ5v5大会</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Oxanium:wght@400;600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style id="css">/* Layout: esports broadcast HUD — live ticker, BLUE vs RED split hero, angled HUD panels floating over a moving arena grid */
:root{
  color-scheme: dark;
  --void:#050817;
  --deep:#0a1030;
  --panel:#0e1640;
  --panel-2:#16205a;
  --line:#28377e;
  --line-hi:#4a5fc4;
  --ink:#eef2ff;
  --dim:#a3add9;
  --mute:#6c78ad;
  --blue:#2f9bff;
  --blue-hi:#9ad6ff;
  --blue-deep:#0b3a8c;
  --red:#ff3a5e;
  --red-hi:#ffa3b3;
  --red-deep:#8a1030;
  --gold:#ffcf3f;
  --ok:#3ce8a0;
  --paper:#f4f6ff;
  --f-display:"Dela Gothic One","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  --f-hud:"Oxanium","Avenir Next Condensed","Segoe UI",system-ui,sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif;
  --s--1:.8rem; --s-0:1rem; --s-1:1.2rem; --s-2:1.55rem; --s-3:2.1rem;
  --s-hero:clamp(2rem,7.4vw,4.6rem);
  --cut:14px;
  --head-h:58px;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{background:var(--void);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.75;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--void)}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;display:block}
#root{position:relative;z-index:1}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--blue-hi)}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
h1,h2,h3{text-wrap:balance;margin:0}
p{margin:0}
.num{font-family:var(--f-hud);font-variant-numeric:tabular-nums}
.wrap{max-width:1160px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.eyebrow{font-family:var(--f-hud);font-weight:600;font-size:var(--s--1);letter-spacing:.28em;text-transform:uppercase;color:var(--blue-hi)}

/* ---------- header ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:color-mix(in srgb,var(--void) 82%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:14px;min-height:var(--head-h)}
.brand{display:flex;align-items:center;gap:10px;flex:none;background:none;border:0;padding:0}
.brand svg{width:30px;height:30px;flex:none}
.brand b{font-family:var(--f-hud);font-weight:800;letter-spacing:.14em;font-size:.95rem;white-space:nowrap}
.brand b i{font-style:normal;color:var(--gold)}
.nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin-left:auto;min-width:0}
.nav::-webkit-scrollbar{display:none}
.nav button{flex:none;background:none;border:0;padding:8px 12px;font-family:var(--f-body);font-weight:700;font-size:.88rem;color:var(--dim);position:relative;white-space:nowrap}
.nav button::after{content:"";position:absolute;left:12px;right:12px;bottom:3px;height:2px;background:var(--gold);transform:scaleX(0);transform-origin:left;transition:transform .25s}
.nav button:hover{color:var(--ink)}
.nav button:hover::after,.nav button.on::after{transform:scaleX(1)}
.nav button.on{color:var(--ink)}

/* ---------- ticker ---------- */
.ticker{position:relative;z-index:1;display:flex;align-items:stretch;border-bottom:1px solid var(--line);background:linear-gradient(90deg,var(--blue-deep),var(--deep) 30%,var(--deep) 70%,var(--red-deep));overflow:hidden}
.ticker .live{flex:none;display:flex;align-items:center;gap:8px;padding:7px 14px 7px max(16px,env(safe-area-inset-left,0px));background:var(--gold);color:#1b1400;font-family:var(--f-hud);font-weight:800;letter-spacing:.18em;font-size:.75rem;clip-path:polygon(0 0,100% 0,calc(100% - 12px) 100%,0 100%);padding-right:22px}
.ticker .live::before{content:"";width:8px;height:8px;border-radius:50%;background:#c4002a;animation:blink 1.2s steps(2) infinite}
.ticker .track{flex:1;min-width:0;overflow:hidden;display:flex;align-items:center}
.ticker .run{display:flex;gap:48px;padding-left:24px;white-space:nowrap;animation:marquee var(--dur,40s) linear infinite;will-change:transform}
.ticker .run span{font-size:.86rem;font-weight:500;color:var(--ink)}
.ticker .run span::before{content:"▶";color:var(--gold);font-size:.6rem;margin-right:10px;vertical-align:2px}
@keyframes marquee{to{transform:translateX(-50%)}}
@keyframes blink{50%{opacity:.2}}

/* ---------- hero ---------- */
.hero{position:relative;padding-block:46px 30px}
.boot{font-family:var(--f-hud);font-size:.78rem;letter-spacing:.2em;color:var(--ok);display:flex;flex-wrap:wrap;gap:4px 12px;margin-bottom:22px}
.boot span{display:inline-block;overflow:hidden;white-space:nowrap;border-right:2px solid var(--ok);animation:caret .9s steps(1) infinite}
.boot b{font-weight:600;color:var(--mute)}
@keyframes caret{50%{border-color:transparent}}
.hero .eyebrow{margin-bottom:12px}
.title{position:relative;font-family:var(--f-display);font-weight:400;font-size:var(--s-hero);line-height:1.08;letter-spacing:.01em;color:var(--paper);text-shadow:0 0 28px color-mix(in srgb,var(--blue) 45%,transparent)}
.title::before,.title::after{content:attr(data-text);position:absolute;inset:0;pointer-events:none;opacity:.9}
.title::before{color:var(--blue);transform:translate(-3px,0);clip-path:inset(0 0 100% 0);animation:glitchA 7s infinite 1.2s}
.title::after{color:var(--red);transform:translate(3px,0);clip-path:inset(100% 0 0 0);animation:glitchB 7s infinite 1.25s}
@keyframes glitchA{0%,6%,100%{clip-path:inset(0 0 100% 0)}1%{clip-path:inset(10% 0 62% 0)}2%{clip-path:inset(55% 0 20% 0)}3%{clip-path:inset(30% 0 48% 0)}4%{clip-path:inset(78% 0 4% 0)}5%{clip-path:inset(4% 0 80% 0)}}
@keyframes glitchB{0%,6%,100%{clip-path:inset(100% 0 0 0)}1%{clip-path:inset(60% 0 12% 0)}2%{clip-path:inset(8% 0 70% 0)}3%{clip-path:inset(44% 0 30% 0)}4%{clip-path:inset(18% 0 58% 0)}5%{clip-path:inset(70% 0 6% 0)}}
.tagline{margin-top:14px;font-size:var(--s-1);font-weight:700;color:var(--dim)}
.when{margin-top:22px;display:flex;flex-wrap:wrap;align-items:center;gap:12px 22px}
.when .date{font-family:var(--f-hud);font-weight:600;font-size:1.05rem;letter-spacing:.06em}
.when .date small{display:block;font-family:var(--f-body);font-size:.78rem;color:var(--mute);letter-spacing:0;font-weight:500}
.count{display:flex;gap:8px}
.count div{min-width:62px;padding:6px 8px 4px;text-align:center;background:var(--panel);border:1px solid var(--line);clip-path:polygon(0 0,calc(100% - 8px) 0,100% 8px,100% 100%,8px 100%,0 calc(100% - 8px))}
.count b{display:block;font-family:var(--f-hud);font-weight:800;font-size:1.55rem;line-height:1.1;font-variant-numeric:tabular-nums;color:var(--gold)}
.count i{font-style:normal;font-family:var(--f-hud);font-size:.62rem;letter-spacing:.2em;color:var(--mute)}
.pending{font-weight:700;color:var(--dim);padding:8px 14px;border:1px dashed var(--line-hi)}

/* VS split */
.vs{margin-top:34px;display:grid;grid-template-columns:1fr auto 1fr;align-items:stretch;gap:0}
.side{position:relative;min-width:0;padding:22px 26px;display:flex;flex-direction:column;gap:10px;overflow:hidden}
.side.blue{background:linear-gradient(120deg,color-mix(in srgb,var(--blue) 38%,var(--deep)),var(--deep) 75%);clip-path:polygon(0 0,100% 0,calc(100% - 26px) 100%,0 100%);animation:inL .8s cubic-bezier(.2,.9,.2,1) both}
.side.red{background:linear-gradient(240deg,color-mix(in srgb,var(--red) 38%,var(--deep)),var(--deep) 75%);clip-path:polygon(26px 0,100% 0,100% 100%,0 100%);text-align:right;align-items:flex-end;animation:inR .8s cubic-bezier(.2,.9,.2,1) both}
@keyframes inL{from{transform:translateX(-40px)}to{transform:none}}
@keyframes inR{from{transform:translateX(40px)}to{transform:none}}
.side::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 3px,rgba(255,255,255,.035) 3px 4px);pointer-events:none}
.side .code{font-family:var(--f-hud);font-weight:800;font-size:clamp(1.6rem,5vw,3rem);letter-spacing:.12em;line-height:1}
.side.blue .code{color:var(--blue-hi)}
.side.red .code{color:var(--red-hi)}
.side .tname{font-weight:700;font-size:.95rem;color:var(--ink)}
.avs{display:flex;gap:0}
.side.red .avs{flex-direction:row-reverse}
.avs span{width:38px;height:38px;border-radius:50%;border:2px solid var(--void);background:var(--panel-2) center/cover;margin-left:-8px;flex:none}
.side.red .avs span{margin-left:0;margin-right:-8px}
.avs span:first-child{margin:0}
.side .wins{display:flex;align-items:baseline;gap:8px}
.side.red .wins{flex-direction:row-reverse}
.side .wins b{font-family:var(--f-hud);font-weight:800;font-size:clamp(2.2rem,6vw,3.6rem);line-height:.9;font-variant-numeric:tabular-nums}
.side .wins i{font-style:normal;font-family:var(--f-hud);font-size:.7rem;letter-spacing:.24em;color:var(--dim)}
.emblem{position:relative;width:clamp(74px,14vw,128px);display:grid;place-items:center;margin-inline:-14px;z-index:2}
.emblem svg{width:100%;height:auto;overflow:visible}
.emblem .r1{transform-origin:50% 50%;animation:spin 14s linear infinite}
.emblem .r2{transform-origin:50% 50%;animation:spin 9s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.emblem text{font-family:var(--f-hud);font-weight:800;font-style:italic}

/* notice */
.notice{margin-top:26px;display:grid;grid-template-columns:auto 1fr;gap:6px 18px;align-items:start;padding:16px 20px;background:color-mix(in srgb,var(--panel) 88%,transparent);border:1px solid var(--line);border-left:3px solid var(--gold)}
.notice .lbl{font-family:var(--f-hud);font-weight:800;letter-spacing:.2em;font-size:.74rem;color:var(--gold);padding-top:3px}
.notice p{min-width:0;font-weight:500}
.notice .place{grid-column:2;font-size:.85rem;color:var(--dim)}

/* ---------- sections ---------- */
.sec{position:relative;padding-block:56px 10px;scroll-margin-top:calc(var(--head-h) + 8px)}
.sec-h{position:relative;display:flex;align-items:flex-end;flex-wrap:wrap;gap:6px 18px;margin-bottom:26px;padding-bottom:14px;border-bottom:1px solid var(--line);overflow:hidden}
.sec-h h2{font-family:var(--f-display);font-weight:400;font-size:var(--s-3);line-height:1.15}
.sec-h .eyebrow{width:100%}
.sec-h .aside{margin-left:auto;font-size:.85rem;color:var(--dim)}
.sec-h::before{content:"";position:absolute;left:0;bottom:-1px;width:120px;height:3px;background:linear-gradient(90deg,var(--blue),var(--red))}
.sec-h::after{content:"";position:absolute;top:0;bottom:0;width:30%;left:-35%;background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--blue-hi) 22%,transparent),transparent);pointer-events:none}
.sec-h.seen::after{animation:sweep 1.1s ease-out 1}
@keyframes sweep{to{left:110%}}

/* players */
.teams{display:grid;grid-template-columns:1fr 1fr;gap:26px}
.team{min-width:0;display:flex;flex-direction:column;gap:12px}
.team-h{display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--panel);border:1px solid var(--line)}
.team-h .code{font-family:var(--f-hud);font-weight:800;letter-spacing:.14em;font-size:1.1rem}
.team.blue .team-h{border-left:4px solid var(--blue)}
.team.red .team-h{border-left:4px solid var(--red)}
.team.blue .team-h .code{color:var(--blue-hi)}
.team.red .team-h .code{color:var(--red-hi)}
.team-h .tname{font-weight:700;min-width:0}
.team-h .sum{margin-left:auto;display:flex;align-items:center;gap:5px;font-size:.85rem;color:var(--dim);white-space:nowrap}
.team-h .sum svg{width:15px;height:15px}
.card{position:relative;display:grid;grid-template-columns:132px 1fr;min-height:150px;background:linear-gradient(135deg,var(--panel-2),var(--panel) 60%);border:1px solid var(--line);clip-path:polygon(0 0,calc(100% - var(--cut)) 0,100% var(--cut),100% 100%,var(--cut) 100%,0 calc(100% - var(--cut)));transform-style:preserve-3d;transition:transform .35s cubic-bezier(.2,.9,.2,1),border-color .3s;--mx:50%;--my:50%}
.card:hover{border-color:var(--line-hi)}
.card.blue{--team:var(--blue);--team-hi:var(--blue-hi)}
.card.red{--team:var(--red);--team-hi:var(--red-hi)}
.card::before{content:"";position:absolute;inset:0;background:radial-gradient(260px circle at var(--mx) var(--my),color-mix(in srgb,var(--team-hi) 22%,transparent),transparent 60%);opacity:0;transition:opacity .3s;pointer-events:none;z-index:2}
.card:hover::before{opacity:1}
.card-img{position:relative;overflow:hidden;background:var(--deep)}
.card-img img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s}
.card:hover .card-img img{transform:scale(1.06)}
.card-img::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent 60%,var(--panel-2)),linear-gradient(115deg,transparent 30%,rgba(255,255,255,.22) 45%,transparent 55%);background-size:100% 100%,250% 100%;background-position:0 0,120% 0;animation:shine 6s ease-in-out infinite;animation-delay:var(--d,0s)}
@keyframes shine{0%,70%{background-position:0 0,120% 0}100%{background-position:0 0,-120% 0}}
.ph{width:100%;height:100%;display:grid;place-items:center;font-family:var(--f-display);font-size:2.4rem;color:var(--team-hi);background:repeating-linear-gradient(45deg,var(--deep) 0 10px,var(--panel) 10px 20px)}
.card-body{position:relative;min-width:0;padding:12px 16px 14px;display:flex;flex-direction:column;gap:2px}
.card .tag{font-family:var(--f-hud);font-size:.72rem;letter-spacing:.12em;color:var(--mute)}
.pname{font-family:var(--f-body);font-weight:700;font-size:1.12rem;line-height:1.35;overflow-wrap:anywhere}
.ptitle{font-family:var(--f-hud);font-size:.78rem;font-style:italic;color:var(--team-hi)}
.stats{display:flex;flex-wrap:wrap;gap:4px 16px;margin:8px 0 2px}
.stats div{display:flex;flex-direction:column}
.stats dt{font-family:var(--f-hud);font-size:.6rem;letter-spacing:.2em;color:var(--mute)}
.stats dd{margin:0;font-family:var(--f-hud);font-weight:800;font-size:1.05rem;font-variant-numeric:tabular-nums;line-height:1.2}
.stats dd.tro{color:var(--gold)}
.stats dd small{font-weight:600;font-size:.72rem;color:var(--mute)}
.best{font-size:.82rem;color:var(--dim)}
.best b{color:var(--ink)}
.comment{margin-top:4px;font-size:.85rem;color:var(--ink);padding-left:10px;border-left:2px solid var(--team)}

/* rules */
.rules{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:14px}
.rule{position:relative;padding:18px 20px 18px 20px;background:color-mix(in srgb,var(--panel) 90%,transparent);border:1px solid var(--line);display:flex;flex-direction:column;gap:6px;min-width:0}
.rule::before{content:"";position:absolute;top:-1px;left:-1px;width:16px;height:16px;border-top:2px solid var(--gold);border-left:2px solid var(--gold)}
.rule::after{content:"";position:absolute;bottom:-1px;right:-1px;width:16px;height:16px;border-bottom:2px solid var(--gold);border-right:2px solid var(--gold)}
.rule .no{font-family:var(--f-hud);font-weight:800;font-size:.72rem;letter-spacing:.24em;color:var(--gold)}
.rule h3{font-size:1.08rem;font-weight:700}
.rule p{color:var(--dim);font-size:.92rem;overflow-wrap:anywhere}

/* maps */
.maps{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,200px),1fr));gap:14px}
.map{position:relative;min-width:0;background:var(--panel);border:1px solid var(--line);overflow:hidden;display:flex;flex-direction:column}
.map .pic{aspect-ratio:1/1;max-width:100%;position:relative;overflow:hidden;background:var(--deep)}
.map .pic img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .6s}
.map:hover .pic img{transform:scale(1.05)}
.map .noimg{position:absolute;inset:0;display:grid;place-items:center;background:repeating-linear-gradient(0deg,transparent 0 22px,color-mix(in srgb,var(--line) 70%,transparent) 22px 23px),repeating-linear-gradient(90deg,var(--deep) 0 22px,color-mix(in srgb,var(--line) 70%,transparent) 22px 23px)}
.map .noimg span{font-family:var(--f-hud);font-size:.7rem;letter-spacing:.24em;color:var(--mute);padding:4px 10px;background:var(--void);border:1px solid var(--line)}
.map .pic::after{content:"";position:absolute;left:0;right:0;height:30%;top:-30%;background:linear-gradient(transparent,color-mix(in srgb,var(--blue-hi) 18%,transparent),transparent);animation:scan 4.5s linear infinite;animation-delay:var(--d,0s);pointer-events:none}
@keyframes scan{to{top:100%}}
.map .cap{padding:10px 14px 12px}
.map h3{font-size:1rem;font-weight:700}
.map p{font-size:.82rem;color:var(--dim)}

/* scores */
.tally{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:18px clamp(14px,4vw,32px);background:linear-gradient(90deg,color-mix(in srgb,var(--blue) 26%,var(--deep)),var(--deep) 40%,var(--deep) 60%,color-mix(in srgb,var(--red) 26%,var(--deep)));border:1px solid var(--line);margin-bottom:18px}
.tally .tb{display:flex;flex-direction:column;gap:2px;min-width:0}
.tally .tb.r{align-items:flex-end;text-align:right}
.tally .tb span{font-family:var(--f-hud);font-weight:800;letter-spacing:.18em;font-size:.82rem}
.tally .tb.b span{color:var(--blue-hi)}
.tally .tb.r span{color:var(--red-hi)}
.tally .tb small{font-size:.78rem;color:var(--dim);overflow-wrap:anywhere}
.tally .big{font-family:var(--f-hud);font-weight:800;font-size:clamp(2.6rem,9vw,4.4rem);line-height:1;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:14px}
.tally .big i{font-style:normal;color:var(--mute);font-size:.5em}
.tally .lab{grid-column:1/-1;text-align:center;font-family:var(--f-hud);font-size:.66rem;letter-spacing:.3em;color:var(--mute)}
.matches{display:flex;flex-direction:column;gap:8px}
.match{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1.3fr) auto auto;align-items:center;gap:8px 16px;padding:12px 16px;background:color-mix(in srgb,var(--panel) 90%,transparent);border:1px solid var(--line);position:relative}
.match.w-blue{border-left:3px solid var(--blue)}
.match.w-red{border-left:3px solid var(--red)}
.match .ml b{display:block;font-weight:700}
.match .ml small,.match .mm small{display:block;font-size:.78rem;color:var(--dim)}
.match .mm{min-width:0;font-size:.9rem}
.match .sc{font-family:var(--f-hud);font-weight:800;font-size:1.4rem;font-variant-numeric:tabular-nums;display:flex;gap:8px;align-items:center;white-space:nowrap}
.match .sc .b{color:var(--blue-hi)}
.match .sc .r{color:var(--red-hi)}
.match .sc i{font-style:normal;color:var(--mute);font-size:.9rem}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;font-family:var(--f-hud);font-weight:700;font-size:.72rem;letter-spacing:.14em;border:1px solid currentColor;white-space:nowrap}
.chip.done{color:var(--dim)}
.chip.next{color:var(--gold)}
.chip.live{color:var(--ok)}
.chip.live::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;animation:pulse 1.2s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 70%,transparent)}100%{box-shadow:0 0 0 9px transparent}}
.win{font-family:var(--f-hud);font-weight:800;font-size:.72rem;letter-spacing:.16em}
.win.blue{color:var(--blue-hi)}
.win.red{color:var(--red-hi)}
.empty{padding:22px;text-align:center;color:var(--dim);border:1px dashed var(--line-hi)}

/* faq */
.faq-wrap{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:26px;align-items:start}
.faq{display:flex;flex-direction:column;gap:8px}
.qa{background:color-mix(in srgb,var(--panel) 90%,transparent);border:1px solid var(--line)}
.qa button{width:100%;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;padding:14px 16px;background:none;border:0;text-align:left}
.qa .q{font-family:var(--f-hud);font-weight:800;color:var(--blue-hi)}
.qa .qt{font-weight:700;min-width:0;overflow-wrap:anywhere}
.qa .pm{font-family:var(--f-hud);color:var(--mute);transition:transform .3s}
.qa.open .pm{transform:rotate(45deg);color:var(--gold)}
.qa .body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s ease}
.qa.open .body{grid-template-rows:1fr}
.qa .body>div{overflow:hidden}
.qa .ans{display:grid;grid-template-columns:auto 1fr;gap:12px;padding:0 16px 16px}
.qa .a{font-family:var(--f-hud);font-weight:800;color:var(--red-hi)}
.qa .at{color:var(--dim);overflow-wrap:anywhere}
.qa .wait{font-size:.72rem;font-family:var(--f-hud);letter-spacing:.14em;color:var(--gold);border:1px solid var(--gold);padding:1px 8px;margin-left:8px;white-space:nowrap}
.ask{position:relative;padding:20px;background:var(--panel);border:1px solid var(--line-hi);display:flex;flex-direction:column;gap:10px;clip-path:polygon(0 0,calc(100% - 18px) 0,100% 18px,100% 100%,18px 100%,0 calc(100% - 18px))}
.ask h3{font-family:var(--f-display);font-weight:400;font-size:1.25rem}
.ask label{font-size:.82rem;font-weight:700;color:var(--dim)}
.ask input,.ask textarea{width:100%;background:var(--void);border:1px solid var(--line-hi);padding:10px 12px;font-size:16px;border-radius:0}
.ask textarea{min-height:110px;resize:vertical}
.ask input:focus,.ask textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px color-mix(in srgb,var(--blue) 30%,transparent)}
.ask .note{font-size:.82rem;color:var(--dim)}
.ask-actions{display:flex;flex-wrap:wrap;gap:10px}
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 20px;font-weight:700;font-size:.92rem;text-decoration:none;color:#06101e;background:var(--blue-hi);border:0;clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%);transition:filter .2s,transform .2s}
.btn:hover{filter:brightness(1.12);transform:translateY(-1px)}
.btn.line{background:#06c755;color:#fff}
.btn.ghost{background:var(--panel-2);color:var(--ink)}
.btn[aria-disabled="true"],.btn:disabled{filter:grayscale(1) brightness(.6);pointer-events:none}
.status{font-size:.85rem;color:var(--ok);min-height:1.4em}

.foot{position:relative;z-index:1;margin-top:60px;padding-block:22px calc(22px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);font-size:.8rem;color:var(--mute)}
.foot .wrap{display:flex;flex-wrap:wrap;gap:6px 20px;justify-content:space-between}

/* ---------- admin ---------- */
.fab{position:fixed;z-index:70;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:8px;padding:12px 18px;background:var(--gold);color:#1b1400;border:0;font-family:var(--f-hud);font-weight:800;letter-spacing:.16em;font-size:.8rem;clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);box-shadow:0 8px 30px rgba(0,0,0,.4)}
.fab svg{width:18px;height:18px}
.fab .dot{width:8px;height:8px;border-radius:50%;background:#c4002a}
.drawer{position:fixed;z-index:80;top:0;right:0;bottom:0;width:min(560px,100%);display:flex;flex-direction:column;background:var(--deep);border-left:1px solid var(--line-hi);box-shadow:-20px 0 60px rgba(0,0,0,.5);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px);transform:translateX(0);transition:transform .35s cubic-bezier(.2,.9,.2,1)}
.drawer[hidden]{display:none!important}
[hidden]{display:none!important}
.dr-h{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.dr-h h2{font-family:var(--f-hud);font-weight:800;letter-spacing:.16em;font-size:.95rem}
.dr-h .st{font-size:.75rem;padding:2px 8px;border:1px solid var(--line-hi);color:var(--dim)}
.dr-h .st.dirty{color:var(--gold);border-color:var(--gold)}
.dr-h .x{margin-left:auto;background:var(--panel);border:1px solid var(--line);width:36px;height:36px;display:grid;place-items:center;font-size:1.1rem}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding:8px 12px 0;border-bottom:1px solid var(--line);flex:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;background:none;border:0;padding:8px 12px;font-weight:700;font-size:.85rem;color:var(--dim);border-bottom:2px solid transparent}
.tabs button.on{color:var(--ink);border-bottom-color:var(--gold)}
.dr-b{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px;-webkit-overflow-scrolling:touch}
.dr-f{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 16px;border-top:1px solid var(--line);background:var(--void)}
.dr-f .msg{flex:1 1 180px;font-size:.82rem;color:var(--dim);min-width:0}
.dr-f .msg.err{color:var(--red-hi)}
.dr-f .msg.ok{color:var(--ok)}
.fld{display:flex;flex-direction:column;gap:4px}
.fld label,.fld .lb{font-size:.78rem;font-weight:700;color:var(--dim)}
.fld input,.fld textarea,.fld select{width:100%;background:var(--void);border:1px solid var(--line-hi);padding:9px 11px;font-size:16px;border-radius:0}
.fld textarea{min-height:80px;resize:vertical}
.fld input:focus,.fld textarea:focus,.fld select:focus{outline:none;border-color:var(--blue)}
.fld .hint{font-size:.74rem;color:var(--mute)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.box{border:1px solid var(--line);background:var(--panel);padding:12px;display:flex;flex-direction:column;gap:10px}
.box-h{display:flex;align-items:center;gap:8px}
.box-h b{font-family:var(--f-hud);letter-spacing:.1em;font-size:.82rem;color:var(--gold);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.box-h .acts{margin-left:auto;display:flex;gap:4px;flex:none}
.mini{background:var(--panel-2);border:1px solid var(--line);padding:5px 10px;font-size:.78rem;font-weight:700}
.mini.danger{color:var(--red-hi);border-color:color-mix(in srgb,var(--red) 50%,var(--line))}
.mini.add{align-self:flex-start;color:var(--gold);border-color:var(--gold);padding:8px 14px}
.imgf{display:flex;gap:10px;align-items:center}
.imgf .th{width:90px;height:72px;flex:none;background:var(--void) center/cover;border:1px solid var(--line)}
.imgf .th.sq{width:72px}
.imgf .ctrls{display:flex;flex-wrap:wrap;gap:6px}
.imgf label.mini{cursor:pointer}
.imgf input[type=file]{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.banner{padding:10px 12px;border:1px solid var(--gold);color:var(--ink);background:color-mix(in srgb,var(--gold) 10%,var(--deep));font-size:.85rem;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.banner span{flex:1 1 200px}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:.85rem}
.qrbox{background:#fff;padding:14px;align-self:center;width:min(300px,100%)}
.qrbox svg{display:block;width:100%;height:auto}
.help{font-size:.82rem;color:var(--dim);line-height:1.7}
.help b{color:var(--ink)}
.sub-h{font-family:var(--f-hud);font-weight:800;letter-spacing:.16em;font-size:.78rem;color:var(--blue-hi);margin-top:6px}
.sub-h.red{color:var(--red-hi)}

/* ---------- card affordance, sync, delta ---------- */
.card[data-pk]{cursor:pointer}
.card .more{position:absolute;right:calc(var(--cut) + 6px);top:8px;z-index:3;font-family:var(--f-hud);font-weight:700;font-size:.62rem;letter-spacing:.18em;color:var(--team-hi);opacity:.7;transition:opacity .2s,transform .2s}
.card:hover .more,.card:focus-visible .more{opacity:1;transform:translateX(3px)}
.card:active{transform:scale(.985)}
.delta{font-family:var(--f-hud);font-weight:700;font-size:.68rem;margin-left:6px;vertical-align:2px;letter-spacing:.04em}
.delta.up{color:var(--ok)}
.delta.down{color:var(--red-hi)}
.sync{display:inline-flex;align-items:center;gap:6px;margin-left:12px;padding:2px 9px;border:1px solid color-mix(in srgb,var(--ok) 55%,transparent);color:var(--ok);font-family:var(--f-hud);font-weight:600;font-size:.7rem;letter-spacing:.12em;white-space:nowrap}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--ok);animation:pulse 1.6s ease-out infinite}
.tapnote{margin:-14px 0 18px;font-size:.82rem;color:var(--mute)}

/* ---------- player detail ---------- */
html.locked,html.locked body{overflow:hidden}
.pm-wrap{position:fixed;inset:0;z-index:90;display:grid;place-items:center;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.pm-back{position:absolute;inset:0;background:color-mix(in srgb,var(--void) 78%,transparent);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:fadeIn .3s ease both}
@keyframes fadeIn{from{opacity:0}}
.pmodal{position:relative;width:min(1100px,100%);height:min(880px,100%);overflow:hidden;display:flex;flex-direction:column;background:linear-gradient(160deg,var(--panel-2),var(--deep) 55%);border:1px solid var(--line-hi);clip-path:polygon(0 0,calc(100% - 22px) 0,100% 22px,100% 100%,22px 100%,0 calc(100% - 22px));box-shadow:0 30px 80px rgba(0,0,0,.6);animation:pmIn .5s cubic-bezier(.2,.9,.2,1) both;-webkit-overflow-scrolling:touch}
.pmodal.blue{--team:var(--blue);--team-hi:var(--blue-hi)}
.pmodal.red{--team:var(--red);--team-hi:var(--red-hi)}
@keyframes pmIn{from{clip-path:polygon(0 48%,100% 48%,100% 52%,0 52%)}to{clip-path:polygon(0 0,calc(100% - 22px) 0,100% 22px,100% 100%,22px 100%,0 calc(100% - 22px))}}
.pm-top{display:flex;align-items:center;gap:12px;padding:10px 14px 10px 18px;background:linear-gradient(90deg,color-mix(in srgb,var(--team) 45%,var(--deep)),transparent 70%);border-bottom:1px solid var(--line)}
.pm-top .code{font-family:var(--f-hud);font-weight:800;letter-spacing:.2em;color:var(--team-hi)}
.pm-file{font-size:.7rem;letter-spacing:.2em;color:var(--dim)}
.pm-x{margin-left:auto;width:38px;height:38px;display:grid;place-items:center;background:var(--void);border:1px solid var(--line-hi);font-size:1rem}
.pm-body{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;display:grid;grid-template-columns:minmax(0,360px) minmax(0,1fr);gap:26px;padding:24px;align-items:start}
.pm-left{min-width:0;display:flex;flex-direction:column;gap:16px}
.pm-art{position:relative;aspect-ratio:360/291;max-width:100%;overflow:hidden;border:1px solid var(--line);background:var(--deep)}
.pm-art img{width:100%;height:100%;object-fit:cover;display:block;animation:artIn .7s .1s cubic-bezier(.2,.9,.2,1) both}
@keyframes artIn{from{transform:scale(1.15);filter:saturate(0) brightness(1.6)}}
.pm-art::before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(transparent 0 46%,color-mix(in srgb,var(--team-hi) 55%,transparent) 50%,transparent 54%);background-size:100% 220%;animation:scanArt 1.1s .1s ease-out both;pointer-events:none}
@keyframes scanArt{from{background-position:0 100%}to{background-position:0 -120%}}
.pm-art::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 3px,rgba(255,255,255,.04) 3px 4px);pointer-events:none}
.pm-art .ph{font-size:4rem}
.pm-info{min-width:0;display:flex;flex-direction:column;gap:6px}
.pm-info .tag{font-family:var(--f-hud);font-size:.76rem;letter-spacing:.14em;color:var(--mute)}
.pm-name{font-family:var(--f-display);font-weight:400;font-size:clamp(1.4rem,4vw,2rem);line-height:1.2;overflow-wrap:anywhere}
.pm-info .ptitle{font-size:.85rem}
.pchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.pchip{display:inline-flex;align-items:baseline;gap:6px;padding:3px 10px;background:var(--void);border:1px solid var(--line-hi);font-weight:700;font-size:.82rem}
.pchip em{font-style:normal;font-family:var(--f-hud);font-size:.62rem;letter-spacing:.16em;color:var(--mute)}
.pm-big{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;margin-top:8px;padding:10px 14px;background:var(--void);border:1px solid var(--line);border-left:3px solid var(--gold)}
.pm-big span{font-family:var(--f-hud);font-size:.66rem;letter-spacing:.22em;color:var(--mute);width:100%}
.pm-big b{font-family:var(--f-hud);font-weight:800;font-size:2.2rem;line-height:1;color:var(--gold)}
.pm-big .delta{font-size:.85rem}
.pm-big em{margin-left:auto;font-style:normal;font-size:.8rem;font-weight:700;color:var(--dim)}
.bars{display:flex;flex-direction:column;gap:10px;margin-top:8px}
.bar-l{display:flex;justify-content:space-between;gap:10px;font-size:.8rem;color:var(--dim)}
.bar-l b{color:var(--ink);font-weight:800}
.bar-l small{color:var(--mute);font-weight:600}
.bar-t{height:6px;background:var(--void);border:1px solid var(--line);overflow:hidden}
.bar-t i{display:block;height:100%;width:var(--w);background:linear-gradient(90deg,color-mix(in srgb,var(--team) 70%,var(--deep)),var(--team-hi));transform-origin:left;animation:grow .9s .25s cubic-bezier(.2,.9,.2,1) both}
@keyframes grow{from{transform:scaleX(0)}}
.pm-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:8px;margin:8px 0 0}
.pm-list div{padding:8px 10px;background:color-mix(in srgb,var(--void) 70%,transparent);border:1px solid var(--line);min-width:0}
.pm-list dt{font-size:.7rem;color:var(--mute);font-weight:700}
.pm-list dd{margin:0;font-weight:700;overflow-wrap:anywhere}
.pm-info .comment{margin-top:6px}
.pm-link{margin-top:8px;align-self:flex-start;font-weight:700;font-size:.85rem}
.pm-nav{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--line);background:var(--void)}
.pm-nav .mini{padding:8px 14px}
.pm-at{flex:1;text-align:center;font-family:var(--f-hud);font-size:.7rem;letter-spacing:.12em;color:var(--mute)}
@media (max-width:760px){
  .pm-body{grid-template-columns:1fr;padding:14px;gap:14px}
  .pm-art{max-height:38vh;margin-inline:auto;width:100%}
  .pm-bio{max-height:42vh}
  .gauge{width:108px}
  .sync{margin-left:0}
}

/* score + profile text */
.card-img .place{position:absolute;left:6px;top:6px;z-index:2;padding:1px 7px;background:color-mix(in srgb,var(--void) 80%,transparent);border:1px solid var(--gold);color:var(--gold);font-weight:800;font-size:.72rem;letter-spacing:.06em}
.stats dd.scr{color:var(--team-hi)}
.pm-score{display:flex;align-items:center;gap:16px;padding:14px;background:color-mix(in srgb,var(--void) 75%,transparent);border:1px solid var(--line)}
.gauge{position:relative;width:128px;flex:none}
.ring{display:block;width:100%;height:auto;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:9}
.ring-bg{stroke:var(--line)}
.ring-fg{stroke:var(--team-hi);stroke-linecap:round;stroke-dasharray:var(--c);stroke-dashoffset:var(--o);animation:ringIn 1.2s .2s cubic-bezier(.2,.9,.2,1) both;filter:drop-shadow(0 0 6px color-mix(in srgb,var(--team-hi) 60%,transparent))}
@keyframes ringIn{from{stroke-dashoffset:var(--c)}}
.g-in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.g-in span{font-family:var(--f-hud);font-size:.58rem;letter-spacing:.24em;color:var(--mute)}
.g-in b{font-family:var(--f-hud);font-weight:800;font-size:1.9rem;color:var(--paper)}
.g-in i{font-style:normal;font-size:.62rem;color:var(--mute)}
.g-side{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.g-place{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.g-place em{font-style:normal;font-size:.72rem;font-weight:700;color:var(--dim);width:100%}
.g-place b{font-family:var(--f-hud);font-weight:800;font-size:1.8rem;line-height:1;color:var(--gold)}
.g-place b small{font-size:.9rem;margin-left:2px}
.g-place span{font-size:.8rem;color:var(--mute)}
.parts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px}
.parts li{display:grid;grid-template-columns:minmax(0,1fr) 40px auto;align-items:center;gap:8px;font-size:.72rem;color:var(--dim)}
.parts li span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.parts li.nodata{opacity:.5}
.pt-bar{height:4px;background:var(--line);overflow:hidden}
.pt-bar i{display:block;height:100%;width:var(--w);background:var(--team-hi);transform-origin:left;animation:grow .9s .35s cubic-bezier(.2,.9,.2,1) both}
.parts b{font-family:var(--f-hud);font-weight:800;color:var(--ink);text-align:right;min-width:52px}
.parts b small{color:var(--mute);font-weight:600}
.pm-bio-wrap{margin-top:8px;display:flex;flex-direction:column;gap:6px}
.pm-lbl{font-family:var(--f-hud);font-weight:700;font-size:.66rem;letter-spacing:.24em;color:var(--team-hi)}
.pm-bio{position:relative;max-height:240px;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:14px 16px;background:color-mix(in srgb,var(--void) 80%,transparent);border:1px solid var(--line);border-left:3px solid var(--team);font-size:.96rem;line-height:1.9;overflow-wrap:anywhere;scrollbar-width:thin;scrollbar-color:var(--team-hi) var(--void)}
.pm-bio::-webkit-scrollbar{width:6px}
.pm-bio::-webkit-scrollbar-track{background:var(--void)}
.pm-bio::-webkit-scrollbar-thumb{background:var(--team-hi)}
.pm-bio-empty{color:var(--mute);font-size:.88rem}
.pm-note{margin-top:10px;font-size:.74rem;color:var(--mute);line-height:1.7}
@media (max-width:760px){.pm-bio{max-height:42vh}.gauge{width:104px}.g-in b{font-size:1.6rem}}

/* ---------- timetable ---------- */
.tt-now{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:10px;margin-bottom:18px}
.tt-nb{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:14px;align-items:center;padding:12px 16px;background:var(--panel);border:1px solid var(--line);min-width:0}
.tt-nb em{grid-row:1/3;font-style:normal;font-family:var(--f-hud);font-weight:800;letter-spacing:.2em;font-size:.8rem;padding:6px 10px;border:1px solid currentColor}
.tt-nb.live em{color:var(--ok);box-shadow:0 0 18px color-mix(in srgb,var(--ok) 35%,transparent);animation:nowGlow 1.6s ease-in-out infinite}
.tt-nb.next em{color:var(--gold)}
@keyframes nowGlow{50%{box-shadow:0 0 4px color-mix(in srgb,var(--ok) 20%,transparent)}}
.tt-nb b{font-weight:700;min-width:0;overflow-wrap:anywhere}
.tt-nb span{font-size:.8rem;color:var(--dim)}
.tt{list-style:none;margin:0;padding:0;position:relative;display:flex;flex-direction:column;gap:12px;max-width:860px}
.tt::before{content:"";position:absolute;left:calc(84px + 13px);top:10px;bottom:10px;width:2px;background:linear-gradient(var(--blue),var(--line) 40%,var(--line) 60%,var(--red))}
.slot{position:relative;display:grid;grid-template-columns:84px 28px minmax(0,1fr);align-items:start;--kc:var(--dim)}
.slot.k-match{--kc:var(--gold)}
.slot.k-prep{--kc:var(--blue-hi)}
.slot.k-break{--kc:var(--ok)}
.tt-time{text-align:right;padding-top:12px;line-height:1.1}
.tt-time b{display:block;font-family:var(--f-hud);font-weight:800;font-size:1.35rem;color:var(--paper)}
.tt-time span{font-family:var(--f-hud);font-size:.75rem;color:var(--mute)}
.tt-dot{justify-self:center;margin-top:17px;width:12px;height:12px;border-radius:50%;background:var(--void);border:2px solid var(--kc);position:relative;z-index:1}
.tt-card{position:relative;min-width:0;padding:12px 16px 14px;background:color-mix(in srgb,var(--panel) 92%,transparent);border:1px solid var(--line);border-left:3px solid var(--kc);display:flex;flex-direction:column;gap:4px;overflow:hidden}
.tt-top{display:flex;align-items:center;gap:8px}
.tt-kind{font-family:var(--f-hud);font-weight:700;font-size:.66rem;letter-spacing:.2em;color:var(--kc)}
.tt-state{margin-left:auto;font-family:var(--f-hud);font-weight:800;font-size:.66rem;letter-spacing:.18em;padding:1px 8px;border:1px solid currentColor}
.tt-state.live{color:var(--ok)}
.tt-state.next{color:var(--gold)}
.tt-state.done{color:var(--mute)}
.tt-card h3{font-size:1.05rem;font-weight:700;overflow-wrap:anywhere}
.tt-card p{font-size:.86rem;color:var(--dim);overflow-wrap:anywhere}
.tt-prog{display:block;height:3px;margin-top:6px;background:var(--line)}
.tt-prog i{display:block;height:100%;background:var(--ok);box-shadow:0 0 8px var(--ok)}
.slot.is-done .tt-card,.slot.is-done .tt-time{opacity:.5}
.slot.is-done .tt-dot{background:var(--kc)}
.slot.is-live .tt-dot{background:var(--ok);border-color:var(--ok);animation:pulse 1.4s ease-out infinite}
.slot.is-live .tt-card{border-color:color-mix(in srgb,var(--ok) 60%,var(--line));border-left-color:var(--ok);box-shadow:0 0 0 1px color-mix(in srgb,var(--ok) 25%,transparent),0 10px 40px color-mix(in srgb,var(--ok) 12%,transparent)}
.slot.is-live .tt-card::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-45%;background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--ok) 14%,transparent),transparent);animation:liveSweep 2.8s linear infinite}
@keyframes liveSweep{to{left:110%}}
.slot.is-next .tt-dot{border-color:var(--gold);box-shadow:0 0 10px color-mix(in srgb,var(--gold) 60%,transparent)}
@media (max-width:560px){
  .tt::before{left:calc(62px + 11px)}
  .slot{grid-template-columns:62px 24px minmax(0,1fr)}
  .tt-time b{font-size:1.1rem}
}

/* ---------- site rating ---------- */
.stars{position:relative;display:inline-block;font-size:1.5rem;line-height:1;letter-spacing:.08em;white-space:nowrap}
.stars::before{content:"★★★★★";color:var(--line)}
.stars i{position:absolute;inset:0 auto 0 0;width:var(--p);overflow:hidden;font-style:normal}
.stars i::before{content:"★★★★★";color:var(--gold);text-shadow:0 0 12px color-mix(in srgb,var(--gold) 55%,transparent)}
.rate-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:18px;align-items:stretch}
.rate-main{position:relative;padding:22px;background:linear-gradient(150deg,var(--panel-2),var(--panel) 60%);border:1px solid var(--line-hi);display:flex;flex-direction:column;gap:10px;align-items:flex-start;overflow:hidden;clip-path:polygon(0 0,calc(100% - 18px) 0,100% 18px,100% 100%,18px 100%,0 calc(100% - 18px))}
.rate-main::after{content:"";position:absolute;top:0;bottom:0;width:35%;left:-40%;background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--gold) 12%,transparent),transparent);animation:liveSweep 4.5s linear infinite;pointer-events:none}
.rate-main .rnd{font-weight:700;font-size:.85rem;color:var(--dim)}
.rate-avg{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.rate-avg b{font-family:var(--f-hud);font-weight:800;font-size:clamp(2.8rem,8vw,3.8rem);line-height:1;color:var(--paper);font-variant-numeric:tabular-nums}
.rate-avg small{font-family:var(--f-hud);color:var(--mute);font-size:.9rem}
.rate-cnt{font-size:.85rem;color:var(--dim)}
.rate-mine{font-size:.85rem;color:var(--ok)}
.rate-dist{display:flex;flex-direction:column;gap:8px;padding:18px 20px;background:color-mix(in srgb,var(--panel) 90%,transparent);border:1px solid var(--line);justify-content:center}
.rd{display:grid;grid-template-columns:34px minmax(0,1fr) 38px;align-items:center;gap:10px;font-family:var(--f-hud);font-size:.82rem;color:var(--dim)}
.rd span:first-child{color:var(--gold);font-weight:700}
.rd b{text-align:right;color:var(--ink);font-variant-numeric:tabular-nums}
.rd-t{height:8px;background:var(--void);border:1px solid var(--line);overflow:hidden}
.rd-t i{display:block;height:100%;width:var(--w);background:linear-gradient(90deg,color-mix(in srgb,var(--gold) 60%,var(--deep)),var(--gold));transform-origin:left;animation:grow .9s cubic-bezier(.2,.9,.2,1) both}
.rate-past{margin-top:16px;display:flex;flex-direction:column;gap:6px}
.rate-past p{font-family:var(--f-hud);font-size:.7rem;letter-spacing:.2em;color:var(--mute)}
.rp{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 14px;background:color-mix(in srgb,var(--panel) 85%,transparent);border:1px solid var(--line)}
.rp b{font-weight:700;min-width:0;overflow-wrap:anywhere}
.rp .stars{font-size:1rem}
.rp span{margin-left:auto;font-family:var(--f-hud);font-size:.85rem;color:var(--dim)}
.rate-wrap{position:fixed;inset:0;z-index:95;display:grid;place-items:end center;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.rate-back{position:absolute;inset:0;background:color-mix(in srgb,var(--void) 60%,transparent);animation:fadeIn .3s ease both}
.rate-card{position:relative;width:min(440px,100%);padding:22px 20px 18px;background:linear-gradient(160deg,var(--panel-2),var(--deep) 70%);border:1px solid var(--gold);box-shadow:0 20px 60px rgba(0,0,0,.55),0 0 30px color-mix(in srgb,var(--gold) 18%,transparent);clip-path:polygon(0 0,calc(100% - 18px) 0,100% 18px,100% 100%,18px 100%,0 calc(100% - 18px));text-align:center;display:flex;flex-direction:column;gap:12px;animation:rateIn .55s cubic-bezier(.2,.9,.2,1) both}
@keyframes rateIn{from{transform:translateY(40px) scale(.96);opacity:0}}
.rate-card .eyebrow{color:var(--gold)}
.rate-card h3{font-family:var(--f-display);font-weight:400;font-size:1.3rem;line-height:1.35}
.rate-card .sub{font-size:.85rem;color:var(--dim)}
.rate-x{position:absolute;top:10px;right:14px;width:34px;height:34px;display:grid;place-items:center;background:var(--void);border:1px solid var(--line-hi);font-size:.95rem}
.pick{display:flex;justify-content:center;gap:6px}
.pick button{background:none;border:0;padding:4px;font-size:2.4rem;line-height:1;color:var(--line);transition:transform .15s,color .15s;-webkit-tap-highlight-color:transparent}
.pick button.on{color:var(--gold);text-shadow:0 0 14px color-mix(in srgb,var(--gold) 60%,transparent)}
.pick button.pop{animation:starPop .35s cubic-bezier(.2,.9,.2,1)}
@keyframes starPop{40%{transform:scale(1.35) rotate(-8deg)}}
.pick-l{min-height:1.4em;font-weight:700;color:var(--gold)}
.rate-act{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.rate-done{padding:10px 0 4px;display:flex;flex-direction:column;gap:8px;align-items:center}
.rate-done b{font-family:var(--f-display);font-weight:400;font-size:1.5rem;color:var(--gold);animation:starPop .5s both}
@media (max-width:760px){.rate-grid{grid-template-columns:1fr}}

/* ---------- cheer (streak) ---------- */
:root{--fire:#ff7a1a;--fire-hi:#ffcf3f;--fire-deep:#b83a00}
.ch-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:18px;align-items:start}
.streak{position:relative;padding:22px 20px 20px;background:radial-gradient(120% 80% at 50% 0%,color-mix(in srgb,var(--fire) 22%,var(--panel-2)),var(--panel) 70%);border:1px solid color-mix(in srgb,var(--fire) 55%,var(--line));display:flex;flex-direction:column;gap:14px;overflow:hidden;clip-path:polygon(0 0,calc(100% - 18px) 0,100% 18px,100% 100%,18px 100%,0 calc(100% - 18px))}
.st-top{display:flex;align-items:center;gap:16px}
.flame{position:relative;width:84px;height:96px;flex:none}
.flame svg{width:100%;height:100%;display:block;overflow:visible}
.flame .f-out{fill:url(#fireg)}
.flame .f-in{fill:#fff3b0}
.flame.off .f-out{fill:#3a4580}
.flame.off .f-in{fill:#5a67a8}
.flame.on svg{transform-origin:50% 90%;animation:flicker 1.6s ease-in-out infinite;filter:drop-shadow(0 0 14px color-mix(in srgb,var(--fire) 70%,transparent))}
@keyframes flicker{0%,100%{transform:scale(1) rotate(-1deg)}30%{transform:scale(1.04,.97) rotate(1.5deg)}60%{transform:scale(.97,1.05) rotate(-1.5deg)}}
.flame.boom svg{animation:boom .9s cubic-bezier(.2,.9,.2,1),flicker 1.6s 0.9s ease-in-out infinite}
@keyframes boom{0%{transform:scale(.6)}45%{transform:scale(1.35) rotate(-6deg)}70%{transform:scale(.92)}100%{transform:scale(1)}}
.spark{position:absolute;left:50%;top:55%;width:8px;height:8px;border-radius:50%;background:var(--fire-hi);opacity:0;pointer-events:none}
.flame.boom .spark{animation:spark .9s ease-out forwards}
@keyframes spark{0%{opacity:1;transform:translate(-50%,-50%) rotate(var(--a)) translateY(0) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) rotate(var(--a)) translateY(-70px) scale(.3)}}
.st-num{min-width:0;display:flex;flex-direction:column;line-height:1.1}
.st-num b{font-family:var(--f-hud);font-weight:800;font-size:clamp(3rem,10vw,4.2rem);line-height:1;color:var(--fire-hi);text-shadow:0 0 22px color-mix(in srgb,var(--fire) 60%,transparent);font-variant-numeric:tabular-nums}
.st-num.zero b{color:var(--mute);text-shadow:none}
.st-num span{font-weight:700;font-size:1.02rem}
.st-num small{font-size:.78rem;color:var(--dim);margin-top:4px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;padding:12px 10px;background:color-mix(in srgb,var(--void) 70%,transparent);border:1px solid var(--line)}
.wd{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:.72rem;font-weight:700;color:var(--mute)}
.wd i{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--panel-2);border:2px solid var(--line);font-style:normal;font-size:.8rem;color:#fff}
.wd.on i{background:linear-gradient(160deg,var(--fire-hi),var(--fire));border-color:var(--fire);box-shadow:0 0 10px color-mix(in srgb,var(--fire) 50%,transparent)}
.wd.on{color:var(--fire-hi)}
.wd.today{color:var(--ink)}
.wd.today:not(.on) i{border-color:var(--fire);border-style:dashed;animation:todayPulse 1.6s ease-in-out infinite}
@keyframes todayPulse{50%{box-shadow:0 0 0 5px color-mix(in srgb,var(--fire) 25%,transparent)}}
.st-msg{font-weight:700;font-size:.92rem;text-align:center}
.st-msg.risk{color:var(--fire-hi)}
.st-msg.done{color:var(--ok)}
.st-msg small{display:block;font-weight:500;font-size:.78rem;color:var(--dim);font-family:var(--f-hud)}
.pick-h{font-size:.78rem;font-weight:700;color:var(--dim)}
.oshi{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 2px 6px;-webkit-overflow-scrolling:touch}
.oshi::-webkit-scrollbar{display:none}
.oshi button{flex:none;display:flex;flex-direction:column;align-items:center;gap:4px;width:74px;padding:8px 4px;background:var(--void);border:1px solid var(--line);font-size:.7rem;font-weight:700;color:var(--dim);transition:border-color .2s,transform .2s}
.oshi button span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.oshi .av{width:40px;height:40px;border-radius:50%;background:var(--panel-2) center/cover;border:2px solid var(--line-hi);display:grid;place-items:center;font-family:var(--f-hud);font-weight:800;font-size:.8rem;color:#fff}
.oshi .blue .av{border-color:var(--blue)}
.oshi .red .av{border-color:var(--red)}
.oshi .tb.blue .av{background:linear-gradient(160deg,var(--blue-hi),var(--blue-deep))}
.oshi .tb.red .av{background:linear-gradient(160deg,var(--red-hi),var(--red-deep))}
.oshi button.on{border-color:var(--fire);color:var(--ink);transform:translateY(-2px);box-shadow:0 6px 18px color-mix(in srgb,var(--fire) 25%,transparent)}
.oshi button:disabled{opacity:.45}
.oshi button.on:disabled{opacity:1}
.btn.fire{width:100%;padding:14px 20px;font-size:1.05rem;color:#2a0e00;background:linear-gradient(180deg,var(--fire-hi),var(--fire));box-shadow:0 5px 0 var(--fire-deep);clip-path:none;border-radius:14px;transition:transform .1s,box-shadow .1s,filter .2s}
.btn.fire:active{transform:translateY(4px);box-shadow:0 1px 0 var(--fire-deep)}
.btn.fire svg{width:22px;height:22px}
.btn.fire:disabled{filter:none;background:var(--panel-2);color:var(--dim);box-shadow:0 5px 0 var(--void)}
.btn.fire:disabled svg{fill:var(--mute)}
.ch-board{display:flex;flex-direction:column;gap:14px}
.tug{padding:16px 18px;background:color-mix(in srgb,var(--panel) 92%,transparent);border:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.tug-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-family:var(--f-hud);font-weight:800}
.tug-h .b{color:var(--blue-hi)}
.tug-h .r{color:var(--red-hi)}
.tug-h b{font-size:1.8rem;line-height:1;font-variant-numeric:tabular-nums}
.tug-h em{font-style:normal;font-family:var(--f-body);font-size:.75rem;color:var(--mute);font-weight:500;text-align:center}
.tug-bar{position:relative;display:flex;height:14px;background:var(--void);border:1px solid var(--line);overflow:hidden}
.tug-bar i{display:block;height:100%;transition:width 1s cubic-bezier(.2,.9,.2,1)}
.tug-bar .b{background:linear-gradient(90deg,var(--blue-deep),var(--blue))}
.tug-bar .r{background:linear-gradient(90deg,var(--red),var(--red-deep))}
.tug-bar::after{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:2px;background:var(--gold)}
.fans{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.fan{display:grid;grid-template-columns:26px 36px minmax(0,1fr) auto;align-items:center;gap:10px;padding:8px 12px;background:color-mix(in srgb,var(--panel) 90%,transparent);border:1px solid var(--line);border-left:3px solid var(--tc)}
.fan.blue{--tc:var(--blue)}
.fan.red{--tc:var(--red)}
.fan .no{font-family:var(--f-hud);font-weight:800;color:var(--mute);text-align:center}
.fan:nth-child(1) .no{color:var(--gold)}
.fan .av{width:36px;height:36px;border-radius:50%;background:var(--panel-2) center/cover;border:2px solid var(--tc)}
.fan b{font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fan .cn{display:flex;align-items:center;gap:4px;font-family:var(--f-hud);font-weight:800;color:var(--fire-hi);white-space:nowrap}
.fan .cn small{color:var(--mute);font-weight:600;font-size:.72rem;margin-left:4px}
.ico-f{width:16px;height:16px;flex:none;fill:var(--fire)}
.stats dd.chr{display:flex;align-items:center;gap:3px;color:var(--fire-hi)}
.stats dd.chr .ico-f{width:14px;height:14px}
.pm-cheer{display:flex;align-items:center;flex-wrap:wrap;gap:8px 12px;margin-top:8px;padding:10px 14px;background:color-mix(in srgb,var(--fire) 10%,var(--void));border:1px solid color-mix(in srgb,var(--fire) 45%,var(--line))}
.pm-cheer .cn{display:flex;align-items:center;gap:5px;font-family:var(--f-hud);font-weight:800;font-size:1.3rem;color:var(--fire-hi)}
.pm-cheer .cn .ico-f{width:20px;height:20px}
.pm-cheer small{font-size:.78rem;color:var(--dim)}
.pm-cheer .btn.fire{width:auto;margin-left:auto;padding:9px 16px;font-size:.88rem;border-radius:10px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:120;transform:translateX(-50%);display:flex;align-items:center;gap:8px;padding:12px 20px;background:linear-gradient(180deg,var(--fire-hi),var(--fire));color:#2a0e00;font-weight:800;border-radius:999px;box-shadow:0 10px 30px rgba(0,0,0,.45);animation:toastIn 2.6s cubic-bezier(.2,.9,.2,1) both;pointer-events:none;width:max-content;max-width:calc(100% - 32px);text-align:center;line-height:1.4}
.toast svg{width:20px;height:20px;fill:#b83a00}
@keyframes toastIn{0%{opacity:0;transform:translate(-50%,30px) scale(.9)}12%{opacity:1;transform:translate(-50%,0) scale(1.05)}20%{transform:translate(-50%,0) scale(1)}85%{opacity:1}100%{opacity:0;transform:translate(-50%,-10px)}}
@media (max-width:860px){.ch-grid{grid-template-columns:1fr}}

/* streak celebration overlay (driven by Web Animations for Safari) */
.celebrate{position:fixed;inset:0;z-index:130;display:grid;place-items:center;padding:16px;background:color-mix(in srgb,var(--void) 84%,transparent);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);cursor:pointer}
.cb-in{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;max-width:100%}
.cb-flame{position:relative;width:150px;height:170px}
.cb-flame svg{position:relative;z-index:1;width:100%;height:100%;display:block;overflow:visible;filter:drop-shadow(0 0 30px rgba(255,122,26,.75))}
.cb-flame .f-out{fill:url(#fireg2)}
.cb-flame .f-in{fill:#fff3b0}
.cb-spark{position:absolute;left:50%;top:58%;width:11px;height:11px;margin:-5.5px 0 0 -5.5px;border-radius:50%;background:var(--fire-hi);box-shadow:0 0 10px var(--fire);opacity:0;pointer-events:none}
.cb-ring{position:absolute;left:50%;top:58%;width:60px;height:60px;margin:-30px 0 0 -30px;border-radius:50%;border:3px solid var(--fire-hi);opacity:0;pointer-events:none}
.cb-num{display:block;font-family:var(--f-hud);font-weight:800;font-size:clamp(4.5rem,18vw,6.5rem);line-height:1;color:var(--fire-hi);text-shadow:0 0 30px color-mix(in srgb,var(--fire) 70%,transparent);font-variant-numeric:tabular-nums}
.cb-t{font-family:var(--f-display);font-weight:400;font-size:clamp(1.3rem,5vw,1.7rem);line-height:1.3}
.cb-s{color:var(--dim);font-weight:700;overflow-wrap:anywhere}
.cb-tap{font-size:.75rem;color:var(--mute);margin-top:12px}

/* ---------- tournament box scores & results table ---------- */
.match-d{display:block}
.match-d>summary{list-style:none;cursor:pointer}
.match-d>summary::-webkit-details-marker{display:none}
.match-d[open]>summary{border-bottom-color:transparent}
.match .open-l{color:var(--mute)!important}
.match-d[open] .open-l{visibility:hidden}
.match .sc i{font-size:.62rem;letter-spacing:.12em}
.starp{display:block;font-family:var(--f-hud);font-weight:800;font-size:.62rem;letter-spacing:.2em;color:var(--gold)}
.starn{display:block;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.boxsc{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px;background:color-mix(in srgb,var(--void) 75%,transparent);border:1px solid var(--line);border-top:0;animation:fadeIn .3s ease both}
.bx{min-width:0;display:flex;flex-direction:column;gap:4px}
.bx-h{font-family:var(--f-hud);font-weight:800;letter-spacing:.2em;font-size:.78rem}
.bx.blue .bx-h{color:var(--blue-hi)}
.bx.red .bx-h{color:var(--red-hi)}
.bx-h em{font-style:normal;color:var(--gold);margin-left:6px}
.bx-r{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:2px 10px;padding:6px 8px;background:var(--panel);border-left:3px solid var(--tc,var(--line))}
.bx.blue .bx-r{--tc:var(--blue)}
.bx.red .bx-r{--tc:var(--red)}
.bx-r b{font-weight:700;font-size:.86rem;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bx-r .st{font-style:normal;color:var(--gold)}
.bx-r .kd{font-weight:800}
.bx-r .kd small{color:var(--mute);margin:0 1px}
.bx-r .dv{font-size:.8rem;color:var(--dim);text-align:right;min-width:62px}
.bx-r .hl{color:var(--ok)}
.bx-r .aw{grid-column:1/-1;font-style:normal;font-size:.68rem;font-weight:700;color:var(--gold)}
.bx-note{grid-column:1/-1;font-size:.72rem;color:var(--mute)}
.tally .cur{display:inline-block;margin-top:6px;font-size:.8rem;letter-spacing:.12em;color:var(--dim)}
.tally .cur b{font-size:1.05rem}
.tally .cur .b{color:var(--blue-hi)}
.tally .cur .r{color:var(--red-hi)}
.tour{margin-top:26px}
.tour-h{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 14px;font-family:var(--f-display);font-weight:400;font-size:1.35rem;margin-bottom:12px}
.tour-h small{font-family:var(--f-body);font-size:.8rem;color:var(--mute)}
.tour-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);background:color-mix(in srgb,var(--panel) 92%,transparent)}
.tour-t{width:100%;min-width:760px;border-collapse:collapse;font-size:.86rem}
.tour-t th{position:sticky;top:0;padding:9px 10px;text-align:right;font-family:var(--f-hud);font-weight:700;font-size:.66rem;letter-spacing:.14em;color:var(--mute);background:var(--deep);border-bottom:1px solid var(--line);white-space:nowrap}
.tour-t th:nth-child(2),.tour-t th:last-child{text-align:left}
.tour-t td{padding:8px 10px;text-align:right;border-bottom:1px solid color-mix(in srgb,var(--line) 60%,transparent);white-space:nowrap}
.tour-t tr[data-pk]{cursor:pointer;transition:background .2s}
.tour-t tr[data-pk]:hover{background:color-mix(in srgb,var(--panel-2) 80%,transparent)}
.tour-t .pl{color:var(--gold);font-weight:800;text-align:left}
.tour-t .nm{text-align:left;display:flex;align-items:center;gap:8px;border-left:3px solid var(--tc)}
.tour-t tr.blue{--tc:var(--blue)}
.tour-t tr.red{--tc:var(--red)}
.tour-t .nm .av{width:28px;height:28px;flex:none;border-radius:50%;background:var(--panel-2) center/cover;border:2px solid var(--tc)}
.tour-t .nm b{font-weight:700;max-width:180px;overflow:hidden;text-overflow:ellipsis}
.tour-t .sc2{font-weight:800;color:var(--paper)}
.tour-t .stc{color:var(--gold);font-weight:800}
.tour-t .awc{text-align:left;font-size:.76rem;color:var(--dim)}
.tour-note{margin-top:8px;font-size:.76rem;color:var(--mute)}
.pm-tour{margin-top:8px;display:flex;flex-direction:column;gap:2px}
@media (max-width:860px){.boxsc{grid-template-columns:1fr}.match .mm{grid-column:1!important;order:3}.match>div:last-child{order:4;grid-column:2}}

/* ---------- wider player detail (3 columns on wide screens) ---------- */
.pmodal{width:min(1480px,100%);height:100%}
.pm-body{grid-template-columns:minmax(0,340px) minmax(0,1.15fr) minmax(0,1fr);gap:24px}
.pm-side{min-width:0;display:flex;flex-direction:column;gap:6px}
.pm-bio{max-height:300px}
.pm-ace{display:flex;align-items:baseline;gap:10px;margin-top:6px;padding:8px 12px;background:linear-gradient(90deg,color-mix(in srgb,var(--gold) 16%,var(--void)),transparent);border-left:3px solid var(--gold)}
.pm-ace span{font-size:.72rem;font-weight:700;color:var(--gold)}
.pm-ace b{font-size:1.05rem}
.best .ace{color:var(--gold)}
.pm-ai{margin-top:10px;display:flex;flex-direction:column;gap:6px}
.pm-lbl.ai{color:var(--ok)}
.pm-ai-box{position:relative;max-height:320px;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:14px 16px;background:linear-gradient(160deg,color-mix(in srgb,var(--ok) 8%,var(--void)),var(--void) 60%);border:1px solid color-mix(in srgb,var(--ok) 40%,var(--line));font-size:.95rem;line-height:1.9;overflow-wrap:anywhere}
.pm-ai-note{font-size:.72rem;color:var(--mute)}
.pm-score{flex-wrap:wrap;justify-content:center}
.pm-score .g-side{min-width:210px}
@media (max-width:1180px){
  .pm-body{grid-template-columns:minmax(0,300px) minmax(0,1fr)}
  .pm-side{grid-column:2}
}
@media (max-width:760px){
  .pm-body{grid-template-columns:1fr}
  .pm-side{grid-column:auto}
  .pm-ai-box{max-height:46vh}
}

/* ---------- hero tug of war + AI forecast ---------- */
.htug{margin-top:18px;display:flex;flex-direction:column;gap:8px}
.htug-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-family:var(--f-hud);font-weight:800;letter-spacing:.12em}
.htug-h .b{color:var(--blue-hi)}
.htug-h .r{color:var(--red-hi)}
.htug-h em{font-style:normal;font-family:var(--f-body);font-weight:500;letter-spacing:0;font-size:.78rem;color:var(--mute)}
.htug-bar{position:relative;display:flex;height:18px;background:var(--void);border:1px solid var(--line-hi);overflow:visible}
.htug-bar i{display:block;height:100%;width:var(--w);transform-origin:var(--o,left);animation:grow 1.2s .4s cubic-bezier(.2,.9,.2,1) both}
.htug-bar i.b{background:linear-gradient(90deg,var(--blue-deep),var(--blue));box-shadow:0 0 16px color-mix(in srgb,var(--blue) 45%,transparent)}
.htug-bar i.r{--o:right;background:linear-gradient(90deg,var(--red),var(--red-deep));box-shadow:0 0 16px color-mix(in srgb,var(--red) 45%,transparent)}
.htug-bar .knot{position:absolute;top:50%;left:var(--x);width:16px;height:26px;margin:-13px 0 0 -8px;background:var(--gold);clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);box-shadow:0 0 12px var(--gold);animation:knot 2.4s ease-in-out infinite}
@keyframes knot{0%,100%{transform:translateX(-3px)}50%{transform:translateX(3px)}}
.htug-l{text-align:center;font-family:var(--f-hud);font-size:.8rem;letter-spacing:.1em;color:var(--dim)}
.htug-l b{font-size:1.1rem}
.htug-l .b{color:var(--blue-hi)}
.htug-l .r{color:var(--red-hi)}
.fc{margin-top:14px;border:1px solid color-mix(in srgb,var(--ok) 45%,var(--line));background:linear-gradient(160deg,color-mix(in srgb,var(--ok) 10%,var(--panel)),var(--panel) 60%)}
.fc>summary{list-style:none;display:flex;align-items:center;gap:12px;padding:12px 16px;cursor:pointer}
.fc>summary::-webkit-details-marker{display:none}
.fc-ic{width:30px;height:30px;flex:none;display:grid;place-items:center;color:var(--ok);animation:orb 3s ease-in-out infinite}
.fc-ic svg{width:26px;height:26px}
@keyframes orb{50%{filter:drop-shadow(0 0 8px var(--ok));transform:translateY(-2px)}}
.fc-t{flex:1;min-width:0;font-weight:700;display:flex;flex-direction:column;line-height:1.35}
.fc-t small{font-weight:500;font-size:.8rem;color:var(--dim)}
.fc-ar{color:var(--ok);transition:transform .3s}
.fc[open] .fc-ar{transform:rotate(180deg)}
.fc-body{padding:4px 16px 16px;display:flex;flex-direction:column;gap:12px;animation:fadeIn .4s ease both}
.fc-prob{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px;font-family:var(--f-hud);font-weight:700;font-size:.8rem;letter-spacing:.1em}
.fc-prob b{font-size:1.2rem}
.fc-prob .b{color:var(--blue-hi)}
.fc-prob .r{color:var(--red-hi)}
.fc-bar{display:flex;height:10px;background:var(--void);border:1px solid var(--line)}
.fc-bar i{display:block;height:100%;width:var(--w)}
.fc-bar .b{background:var(--blue)}
.fc-bar .r{background:var(--red)}
.fc-text{font-size:.92rem;line-height:1.9;overflow-wrap:anywhere}
.fc-note{font-size:.72rem;color:var(--mute)}

/* ---------- team score + data win rate ---------- */
.tscore{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:4px 14px;padding:10px 14px;margin-top:-6px;background:linear-gradient(90deg,color-mix(in srgb,var(--tc) 18%,var(--deep)),var(--deep) 70%);border:1px solid var(--line);border-left:4px solid var(--tc)}
.team.blue .tscore{--tc:var(--blue);--th:var(--blue-hi)}
.team.red .tscore{--tc:var(--red);--th:var(--red-hi)}
.tscore .tl{font-family:var(--f-hud);font-weight:800;font-size:.72rem;letter-spacing:.2em;color:var(--th);display:flex;flex-direction:column;line-height:1.3}
.tscore .tl small{font-family:var(--f-body);font-weight:500;letter-spacing:0;font-size:.7rem;color:var(--mute)}
.tscore>b{font-family:var(--f-hud);font-weight:800;font-size:1.9rem;line-height:1;color:var(--paper);text-align:right}
.tscore>b small{font-size:.8rem;color:var(--mute);font-weight:600;margin-left:2px}
.tscore .tavg{font-size:.78rem;color:var(--dim);white-space:nowrap}
.tscore .tavg b{color:var(--th);font-size:1rem}
.tscore .tbar{grid-column:1/-1;height:5px;background:var(--void);overflow:hidden}
.tscore .tbar i{display:block;height:100%;width:var(--w);background:linear-gradient(90deg,var(--tc),var(--th));transform-origin:left;animation:grow 1.1s .3s cubic-bezier(.2,.9,.2,1) both}
.dwin{margin:0 0 20px;padding:14px 18px;background:color-mix(in srgb,var(--panel) 92%,transparent);border:1px solid var(--line-hi);display:flex;flex-direction:column;gap:8px}
.dwin-h{display:flex;align-items:baseline;gap:10px;font-weight:700;font-size:.92rem}
.dwin-h span{font-family:var(--f-hud);font-weight:800;font-size:.7rem;letter-spacing:.2em;color:var(--gold)}
.dwin-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px;font-family:var(--f-hud);font-weight:700;font-size:.8rem;letter-spacing:.1em}
.dwin-row b{font-size:1.5rem}
.dwin-row .b{color:var(--blue-hi)}
.dwin-row .r{color:var(--red-hi)}
.dwin-bar{display:flex;height:14px;background:var(--void);border:1px solid var(--line)}
.dwin-bar i{display:block;height:100%;width:var(--w);transform-origin:left;animation:grow 1.1s .3s cubic-bezier(.2,.9,.2,1) both}
.dwin-bar .b{background:linear-gradient(90deg,var(--blue-deep),var(--blue))}
.dwin-bar .r{transform-origin:right;background:linear-gradient(90deg,var(--red),var(--red-deep))}
.dwin-n{font-size:.74rem;color:var(--mute)}

/* ---------- site visitors ---------- */
.live-now{display:inline-flex;align-items:center;gap:8px;padding:5px 12px;border:1px solid color-mix(in srgb,var(--ok) 55%,transparent);background:color-mix(in srgb,var(--ok) 10%,var(--void));font-size:.85rem;font-weight:700;color:var(--ink)}
.live-now i{width:8px;height:8px;border-radius:50%;background:var(--ok);animation:pulse 1.6s ease-out infinite}
.live-now b{font-size:1.1rem;color:var(--ok)}
#acc-body{position:relative}
.acc-tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:16px}
.acc-t{padding:14px 16px;background:color-mix(in srgb,var(--panel) 92%,transparent);border:1px solid var(--line);display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 6px;min-width:0}
.acc-t span{width:100%;font-size:.78rem;font-weight:700;color:var(--dim)}
.acc-t b{font-family:var(--f-hud);font-weight:800;font-size:2.1rem;line-height:1.1;color:var(--paper)}
.acc-t b small{font-size:.85rem;color:var(--dim);margin-left:2px}
.acc-t em{font-style:normal;font-size:.85rem;color:var(--dim)}
.acc-t.live{border-color:color-mix(in srgb,var(--ok) 50%,var(--line))}
.acc-t.live b{color:var(--ok)}
.acc-charts{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.acc-c{margin:0;padding:14px 14px 8px;background:color-mix(in srgb,var(--panel) 92%,transparent);border:1px solid var(--line);min-width:0}
.acc-c figcaption{font-weight:700;font-size:.95rem;display:flex;flex-direction:column;margin-bottom:6px}
.acc-c figcaption small{font-weight:500;font-size:.74rem;color:var(--mute)}
.chart{display:block;width:100%;height:auto;overflow:visible}
.chart .cg{stroke:var(--line);stroke-width:1;stroke-dasharray:2 4}
.chart .ca{stroke:var(--line-hi);stroke-width:1}
.chart .ct{fill:var(--mute);font-family:var(--f-hud);font-size:12px}
.chart .cb path{fill:color-mix(in srgb,var(--gold) 55%,var(--deep));transition:fill .15s}
.chart .cb.hi path{fill:var(--gold)}
.chart .cb .hit{fill:transparent}
.chart .cb:hover path{fill:var(--paper)}
.ctip{position:absolute;z-index:5;pointer-events:none;padding:5px 10px;background:var(--void);border:1px solid var(--gold);font-size:.8rem;font-weight:700;white-space:nowrap}
.acc-note{margin-top:8px;font-size:.74rem;color:var(--mute)}
@media (max-width:860px){.acc-tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.acc-charts{grid-template-columns:1fr}}

/* ---------- responsive ---------- */
@media (max-width:860px){
  .teams{grid-template-columns:1fr}
  .faq-wrap{grid-template-columns:1fr}
  .match{grid-template-columns:minmax(0,1fr) auto;}
  .match .mm{grid-column:1/-1;order:3}
  .match .chip,.match .win{justify-self:end}
}
@media (max-width:560px){
  .brand b{font-size:.8rem}
  .hero{padding-block:30px 20px}
  .side{padding:16px 14px}
  .side.blue{clip-path:polygon(0 0,100% 0,calc(100% - 16px) 100%,0 100%)}
  .side.red{clip-path:polygon(16px 0,100% 0,100% 100%,0 100%)}
  .avs span{width:28px;height:28px}
  .side .tname{font-size:.8rem}
  .card{grid-template-columns:104px 1fr}
  .count div{min-width:52px}
  .count b{font-size:1.25rem}
  .row3{grid-template-columns:1fr 1fr}
  .notice{grid-template-columns:1fr}
  .notice .place{grid-column:1}
}
@media (prefers-reduced-motion:reduce){
  html:not(.fx-on) *,html:not(.fx-on) *::before,html:not(.fx-on) *::after{animation-duration:.001s!important;animation-iteration-count:1!important;transition-duration:.001s!important}
  html:not(.fx-on) .ticker .run{animation:none;flex-wrap:wrap;white-space:normal;gap:6px 30px;padding:6px 16px}
  html:not(.fx-on) .ticker .run span[aria-hidden]{display:none}
  html:not(.fx-on) .title::before,html:not(.fx-on) .title::after{display:none}
}

/* tournament-only ranking (players section) */
.trk{margin-top:14px;margin-bottom:22px;border-color:color-mix(in srgb,var(--gold) 50%,var(--line));background:linear-gradient(160deg,color-mix(in srgb,var(--gold) 9%,var(--panel)),var(--panel) 60%)}
.trk .fc-ic,.trk .fc-ar{color:var(--gold)}
.trk .fc-ic svg{width:24px;height:24px}
.trk-l{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.trk-r{display:grid;grid-template-columns:44px 40px minmax(0,1fr) auto;align-items:center;gap:10px;padding:8px 12px;background:color-mix(in srgb,var(--void) 65%,transparent);border:1px solid var(--line);border-left:3px solid var(--tc);cursor:pointer;transition:background .2s,transform .2s;animation:trkIn .5s cubic-bezier(.2,.9,.2,1) both;animation-delay:calc(var(--i) * 60ms)}
.trk-r.blue{--tc:var(--blue);--th:var(--blue-hi)}
.trk-r.red{--tc:var(--red);--th:var(--red-hi)}
.trk-r:hover{background:color-mix(in srgb,var(--panel-2) 85%,transparent);transform:translateX(3px)}
@keyframes trkIn{from{opacity:0;transform:translateY(8px)}}
.trk-r.top1{border-color:color-mix(in srgb,var(--gold) 60%,var(--line));border-left-color:var(--tc);box-shadow:0 0 18px color-mix(in srgb,var(--gold) 14%,transparent)}
.trk-pl{font-weight:800;font-size:1rem;color:var(--mute);text-align:center}
.trk-pl i{font-style:normal;font-size:1.5rem;line-height:1}
.trk-av{width:40px;height:40px;border-radius:50%;background:var(--panel-2) center/cover;border:2px solid var(--tc);display:grid;place-items:center;font-weight:700;color:var(--th)}
.trk-m{min-width:0;display:flex;flex-direction:column;gap:2px}
.trk-m b{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trk-m small{font-size:.74rem;color:var(--dim);line-height:1.45}
.trk-m small em{font-style:normal;color:var(--gold);font-weight:700}
.trk-bar{display:block;height:4px;background:var(--line);overflow:hidden;margin-top:2px}
.trk-bar i{display:block;height:100%;width:var(--w);background:linear-gradient(90deg,var(--tc),var(--th));transform-origin:left;animation:grow .9s .2s cubic-bezier(.2,.9,.2,1) both}
.trk-s{text-align:right;line-height:1}
.trk-s b{font-weight:800;font-size:1.5rem;color:var(--paper)}
.trk-r.top1 .trk-s b{color:var(--gold)}
.trk-s small{font-size:.7rem;color:var(--mute);margin-left:2px}
@media (max-width:560px){.trk-r{grid-template-columns:34px 34px minmax(0,1fr) auto;gap:8px;padding:8px 10px}.trk-av{width:34px;height:34px}.trk-s b{font-size:1.25rem}}
@media (prefers-reduced-motion:reduce){html:not(.fx-on) .trk-r,html:not(.fx-on) .trk-bar i{animation:none}}

/* ---------- ⚡ FX: site-wide motion ---------- */
.fx-pre{opacity:0}
#fx-layer{position:fixed;inset:0;z-index:120;pointer-events:none;overflow:hidden}
.fx-cf{position:absolute;width:9px;height:14px;border-radius:2px;will-change:transform,opacity}
.fx-cf.r{width:10px;height:10px;border-radius:50%}
.fx-ring{position:absolute;width:44px;height:44px;border-radius:50%;border:3px solid;will-change:transform,opacity}
.fx-sp{position:absolute;width:4px;height:12px;border-radius:2px;will-change:transform,opacity}
.fx-combo{position:absolute;font-family:var(--f-hud);font-weight:800;font-style:italic;font-size:1.1rem;letter-spacing:.06em;white-space:nowrap;text-shadow:0 2px 0 #000,0 0 14px currentColor;-webkit-text-stroke:1px rgba(0,0,0,.6)}
.fx-combo.big{font-size:1.7rem}
.fx-prog{position:fixed;left:0;right:0;top:0;height:3px;z-index:65;pointer-events:none}
.fx-prog i{display:block;height:100%;transform-origin:left;transform:scaleX(0);background:linear-gradient(90deg,var(--blue),var(--gold),var(--red));box-shadow:0 0 10px var(--gold)}
.fx-toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:130;padding:10px 20px;background:var(--gold);color:#1b1400;font-weight:800;clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%);box-shadow:0 10px 30px rgba(0,0,0,.4);white-space:nowrap}
.fx-tg{flex:none;display:inline-flex;align-items:center;gap:4px;padding:5px 10px;background:var(--panel);border:1px solid var(--line-hi);color:var(--dim);font-family:var(--f-hud);font-weight:800;font-size:.72rem;letter-spacing:.1em;clip-path:polygon(6px 0,100% 0,calc(100% - 6px) 100%,0 100%)}
.fx-tg span{font-size:.95rem;filter:grayscale(1)}
.fx-tg.on{background:color-mix(in srgb,var(--gold) 22%,var(--panel));border-color:var(--gold);color:var(--gold)}
.fx-tg.on span{filter:none;animation:zap 1.8s ease-in-out infinite}
@keyframes zap{0%,80%,100%{transform:none}84%{transform:scale(1.4) rotate(-12deg)}90%{transform:scale(.9) rotate(8deg)}}
.title .ch{display:inline-block}
.nav button[data-go="vs"]{color:var(--gold)}
html.fx-on .nav button[data-go="vs"]{animation:navHot 2.4s ease-in-out infinite}
@keyframes navHot{0%,100%{text-shadow:none}50%{text-shadow:0 0 12px color-mix(in srgb,var(--gold) 80%,transparent)}}
/* extra life when FX is on */
html.fx-on .btn:hover{transform:translateY(-2px) scale(1.03);filter:brightness(1.18)}
html.fx-on .side .wins b{animation:winsGlow 3s ease-in-out infinite}
html.fx-on .side.red .wins b{animation-delay:1.5s}
@keyframes winsGlow{0%,100%{text-shadow:none}50%{text-shadow:0 0 22px currentColor,0 0 4px currentColor}}
html.fx-on .card .ph,html.fx-on .card-img img{transition:transform .5s}
html.fx-on .card:hover .card-img img{transform:scale(1.1) rotate(-2deg)}
html.fx-on .sec-h h2{background:linear-gradient(90deg,var(--paper) 0 40%,var(--gold) 50%,var(--paper) 60% 100%);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:h2Shine 6s linear infinite}
@keyframes h2Shine{0%{background-position:100% 0}100%{background-position:-100% 0}}

/* ---------- VS simulator ---------- */
:root{--va:#ffcf3f;--va-hi:#ffe68a;--vb:#d26bff;--vb-hi:#ecb6ff}
.vs-sim{position:relative;padding:18px;background:linear-gradient(160deg,color-mix(in srgb,var(--va) 7%,var(--panel)),var(--panel) 45%,color-mix(in srgb,var(--vb) 9%,var(--panel)));border:1px solid var(--line-hi);display:flex;flex-direction:column;gap:14px;clip-path:polygon(0 0,calc(100% - 18px) 0,100% 18px,100% 100%,18px 100%,0 calc(100% - 18px))}
.vs-modes{display:flex;flex-wrap:wrap;gap:6px}
.vs-mode{padding:7px 14px;background:var(--void);border:1px solid var(--line-hi);font-family:var(--f-hud);font-weight:800;font-size:.95rem;letter-spacing:.06em;color:var(--dim);clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%);transition:color .2s,background .2s}
.vs-mode.on{background:var(--gold);border-color:var(--gold);color:#1b1400}
.vs-mode.teams{margin-left:auto;background:linear-gradient(90deg,var(--blue-deep),var(--red-deep));color:var(--ink);font-size:.8rem}
.vs-arena{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:10px;align-items:stretch}
.vs-side{min-width:0;padding:12px;border:2px solid var(--line);background:color-mix(in srgb,var(--void) 60%,transparent);display:flex;flex-direction:column;gap:8px;cursor:pointer;transition:border-color .25s,box-shadow .25s}
.vs-side.s-a{--sc:var(--va);--sh:var(--va-hi)}
.vs-side.s-b{--sc:var(--vb);--sh:var(--vb-hi)}
.vs-side.on{border-color:var(--sc);box-shadow:0 0 0 1px var(--sc),0 0 26px color-mix(in srgb,var(--sc) 30%,transparent)}
.vs-lab{display:flex;align-items:baseline;gap:8px;font-family:var(--f-hud);font-weight:800;letter-spacing:.14em;color:var(--sh)}
.vs-lab small{font-weight:600;font-size:.72rem;color:var(--mute);letter-spacing:.06em}
.vs-side.on .vs-lab::after{content:"← ここに入る";margin-left:auto;font-family:var(--f-body);font-size:.7rem;letter-spacing:0;color:var(--sc);animation:blink 1.2s steps(2) infinite}
.vs-side.s-b.on .vs-lab::after{content:"ここに入る →"}
.vs-slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr));gap:6px}
.vs-slot{position:relative;min-height:56px;display:flex;align-items:center;gap:8px;padding:6px 8px;background:var(--panel);border:1px dashed var(--line-hi);text-align:left;min-width:0}
.vs-slot .vs-plus{margin:auto;font-size:1.4rem;color:var(--sc);opacity:.7}
.vs-side.on .vs-slot:not(.full) .vs-plus{animation:plusPulse 1.2s ease-in-out infinite}
@keyframes plusPulse{50%{transform:scale(1.3);opacity:1}}
.vs-slot.full{border:1px solid var(--sc);background:linear-gradient(135deg,color-mix(in srgb,var(--sc) 18%,var(--panel)),var(--panel))}
.vs-slot b{min-width:0;flex:1;font-size:.82rem;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vs-slot small{font-family:var(--f-hud);font-weight:800;font-size:.8rem;color:var(--sh)}
.vs-x{position:absolute;top:-1px;right:3px;font-style:normal;font-size:.75rem;color:var(--mute)}
