.vs-av{width:36px;height:36px;flex:none;border-radius:50%;background:var(--panel-2) center/cover;border:2px solid var(--blue);display:grid;place-items:center;font-weight:700}
.vs-av.t-red{border-color:var(--red)}
.vs-mid{display:grid;place-items:center;padding-inline:2px}
.vs-mid b{font-family:var(--f-hud);font-weight:800;font-style:italic;font-size:clamp(1.4rem,4vw,2.2rem);background:linear-gradient(180deg,var(--va),var(--vb));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 10px color-mix(in srgb,var(--va) 50%,transparent))}
html.fx-on .vs-mid b{animation:vsBeat 1.4s ease-in-out infinite}
@keyframes vsBeat{0%,100%{transform:scale(1) rotate(-4deg)}50%{transform:scale(1.18) rotate(4deg)}}
.vs-hint{font-size:.85rem;font-weight:700;color:var(--dim);text-align:center}
.vs-roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr));gap:8px}
.vs-p{position:relative;display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--void);border:1px solid var(--line);border-left:3px solid var(--blue);text-align:left;min-width:0;transition:opacity .2s,border-color .2s}
.vs-p.t-red{border-left-color:var(--red)}
.vs-p b{flex:1;min-width:0;font-size:.85rem;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vs-p small{font-family:var(--f-hud);font-weight:800;font-size:.8rem;color:var(--dim)}
.vs-p em{position:absolute;top:-8px;right:-4px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-family:var(--f-hud);font-weight:800;font-size:.75rem;color:#1b1400}
.vs-p.in-a{border-color:var(--va);background:color-mix(in srgb,var(--va) 12%,var(--void))}
.vs-p.in-a em{background:var(--va)}
.vs-p.in-b{border-color:var(--vb);background:color-mix(in srgb,var(--vb) 14%,var(--void))}
.vs-p.in-b em{background:var(--vb)}
.vs-act{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.vs-go{font-size:1.05rem;padding:13px 28px;background:linear-gradient(90deg,var(--va),#ff7a1a,var(--vb));color:#1b1400}
html.fx-on .vs-go:not(:disabled){animation:goPulse 1.3s ease-in-out infinite}
@keyframes goPulse{50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--va) 25%,transparent);transform:scale(1.05)}}
.vs-out{padding:16px;border:1px solid var(--line-hi);background:color-mix(in srgb,var(--void) 70%,transparent);display:flex;flex-direction:column;gap:12px}
.vs-out.w-a{border-color:var(--va)}
.vs-out.w-b{border-color:var(--vb)}
.vs-verdict{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px}
.vs-verdict b{font-family:var(--f-display);font-weight:400;font-size:clamp(1.3rem,4vw,1.8rem)}
.vs-out.w-a .vs-verdict b{color:var(--va)}
.vs-out.w-b .vs-verdict b{color:var(--vb-hi)}
.vs-verdict em{font-style:normal;font-weight:800;font-size:.8rem;padding:2px 10px;border:1px solid currentColor;color:var(--ok)}
.vs-pbar{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px;font-family:var(--f-hud);font-weight:800}
.vs-pbar b{font-size:1.4rem}
.vs-pbar .pa{color:var(--va)}
.vs-pbar .pb{color:var(--vb-hi)}
.vs-pt{display:flex;height:14px;background:var(--void);border:1px solid var(--line);overflow:hidden}
.vs-pt i{display:block;height:100%;width:var(--w)}
.vs-pt .a{background:linear-gradient(90deg,#c98f00,var(--va));transform-origin:left}
.vs-pt .b{background:linear-gradient(90deg,var(--vb),#8a2bd0);transform-origin:right}
.vs-why{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px;font-size:.9rem;color:var(--dim)}
.vs-why b{color:var(--ink)}
@media (max-width:640px){
  .vs-sim{padding:12px}
  .vs-arena{grid-template-columns:1fr;gap:6px}
  .vs-mid{padding:0}
  .vs-mid b{font-size:1.4rem}
  .vs-mode.teams{margin-left:0}
  .vs-roster{grid-template-columns:repeat(2,minmax(0,1fr))}
}
/* battle overlay */
.vsb{position:fixed;inset:0;z-index:110;display:grid;place-items:center;overflow:hidden;cursor:pointer;padding:max(16px,env(safe-area-inset-top,0px)) 16px max(16px,env(safe-area-inset-bottom,0px))}
.vsb-bg{position:absolute;inset:0;background:radial-gradient(circle at 25% 50%,color-mix(in srgb,var(--va) 30%,transparent),transparent 55%),radial-gradient(circle at 75% 50%,color-mix(in srgb,var(--vb) 34%,transparent),transparent 55%),color-mix(in srgb,var(--void) 97%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.vsb-bg::after{content:"";position:absolute;inset:-50%;background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.05) 0 6deg,transparent 6deg 18deg);animation:spin 18s linear infinite}
.vsb-stage{position:relative;width:min(1000px,100%);display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:12px}
.vsb-side{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;min-width:0}
.vsb-side b{font-family:var(--f-hud);font-weight:800;letter-spacing:.16em;font-size:clamp(1rem,3vw,1.5rem)}
.vsb-side.s-a b{color:var(--va)}
.vsb-side.s-b b{color:var(--vb-hi)}
.vsb-side span{font-size:.8rem;color:var(--dim);overflow-wrap:anywhere}
.vsb-avs{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;max-width:100%}
.vsb-av{width:clamp(48px,11vw,96px);height:clamp(48px,11vw,96px);border-radius:50%;background:var(--panel-2) center/cover;border:3px solid var(--va);display:grid;place-items:center;font-size:1.6rem;font-weight:700;box-shadow:0 0 24px color-mix(in srgb,var(--va) 50%,transparent)}
.vsb-side.s-b .vsb-av{border-color:var(--vb);box-shadow:0 0 24px color-mix(in srgb,var(--vb) 50%,transparent)}
.vsb-side.won .vsb-av{box-shadow:0 0 40px var(--gold),0 0 0 4px var(--gold)}
.vsb-vs{font-family:var(--f-hud);font-weight:800;font-style:italic;font-size:clamp(3rem,12vw,7rem);line-height:1;background:linear-gradient(180deg,#fff,var(--va) 45%,var(--vb));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 20px rgba(255,255,255,.4))}
.vsb-cd{position:absolute;left:50%;top:22%;translate:-50% -50%;font-family:var(--f-hud);font-weight:800;font-style:italic;font-size:clamp(4rem,16vw,9rem);line-height:1;color:#fff;text-shadow:0 0 30px var(--gold),0 6px 0 #000;opacity:0;white-space:nowrap;pointer-events:none}
.vsb-win{position:absolute;left:50%;top:70%;visibility:hidden;width:min(560px,92vw);padding:20px 22px;text-align:center;background:linear-gradient(160deg,var(--panel-2),var(--deep));border:2px solid var(--gold);box-shadow:0 0 60px color-mix(in srgb,var(--gold) 40%,transparent),0 20px 60px rgba(0,0,0,.6);clip-path:polygon(0 0,calc(100% - 20px) 0,100% 20px,100% 100%,20px 100%,0 calc(100% - 20px))}
.vsb-win em{display:block;font-style:normal;font-family:var(--f-hud);font-weight:800;letter-spacing:.4em;font-size:.8rem;color:var(--gold)}
.vsb-win b{display:block;font-family:var(--f-display);font-weight:400;font-size:clamp(1.5rem,5vw,2.4rem);line-height:1.3;margin:6px 0}
.vsb-win p{font-family:var(--f-hud);font-weight:800;font-size:clamp(2.6rem,9vw,4rem);line-height:1;color:var(--gold)}
.vsb-win p small{display:block;margin-top:6px;font-family:var(--f-body);font-size:.95rem;color:var(--ok)}
.vsb-flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.vsb-skip{position:absolute;bottom:max(16px,env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;font-size:.75rem;color:var(--mute)}
@media (max-width:640px){.vsb-stage{grid-template-columns:1fr;gap:4px}.vsb-vs{font-size:3.2rem}.vsb-cd{top:50%}.vsb-av{width:56px;height:56px}.vsb-win{top:74%}}

function tourCtx(s) {

var TOUR_PARTS = [

/* ===== timetable ===== */
var KINDS = { prep: '準備', match: '試合', break: '休憩', other: 'その他' };
function eventBase(s) { var d = parseDate(s.meta.date); return d ? new Date(d.getFullYear(), d.getMonth(), d.getDate()) : null; }
function atTime(base, hhmm) {
  var m = /^(\d{1,2}):(\d{2})$/.exec(String(hhmm || '').trim());
  if (!base || !m) return null;
  var t = new Date(base.getTime()); t.setHours(Number(m[1]), Number(m[2]), 0, 0); return t;
}
function slotStates(s) {
  var base = eventBase(s), items = s.schedule || [], now = Date.now(), nextFound = false;
  return items.map(function (it, i) {
    var st = atTime(base, it.time);
    var nx = null;
    for (var j = i + 1; j < items.length && !nx; j++) nx = atTime(base, items[j].time);
    var en = atTime(base, it.end) || nx || (st ? new Date(st.getTime() + 30 * 6e4) : null);
    var state = '';
    if (st && en) {
      if (now >= en.getTime()) state = 'done';
      else if (now >= st.getTime()) state = 'live';
      else if (!nextFound) { state = 'next'; nextFound = true; }
    }
    return { it: it, st: st, en: en, state: state };
  });
}
function untilText(ms) {
  var m = Math.round(ms / 6e4);
  if (m < 1) return 'まもなく';
  if (m < 60) return 'あと' + m + '分';
  var h = Math.floor(m / 60), r = m % 60;
  return 'あと' + h + '時間' + (r ? r + '分' : '');
}
function scheduleBody(s) {
  var ss = slotStates(s);
  if (!ss.length) return '<p class="empty">タイムテーブルは準備中です</p>';
  var live = ss.filter(function (x) { return x.state === 'live'; })[0];
  var next = ss.filter(function (x) { return x.state === 'next'; })[0];
  var strip = '';
  if (live || next) {
    strip = '<div class="tt-now">' +
      (live ? '<div class="tt-nb live"><em>NOW</em><b>' + esc(live.it.title || KINDS[live.it.kind] || '') + '</b><span class="num">' + esc(live.it.time) + (live.en ? '〜' + pad(live.en.getHours()) + ':' + pad(live.en.getMinutes()) : '') + '</span></div>' : '') +
      (next ? '<div class="tt-nb next"><em>NEXT</em><b>' + esc(next.it.title || KINDS[next.it.kind] || '') + '</b><span class="num">' + esc(next.it.time) + ' ・ ' + untilText(next.st.getTime() - Date.now()) + '</span></div>' : '') +
      '</div>';
  }
  var list = ss.map(function (x, i) {
    var it = x.it, k = KINDS[it.kind] ? it.kind : 'other';
    var tag = x.state === 'live' ? '<span class="tt-state live">NOW</span>' : x.state === 'next' ? '<span class="tt-state next">NEXT</span>' : x.state === 'done' ? '<span class="tt-state done">終了</span>' : '';
    var prog = '';
    if (x.state === 'live' && x.st && x.en) {
      var f = Math.max(0, Math.min(1, (Date.now() - x.st.getTime()) / (x.en.getTime() - x.st.getTime())));
      prog = '<span class="tt-prog"><i style="width:' + Math.round(f * 100) + '%"></i></span>';
    }
    return '<li class="slot k-' + k + (x.state ? ' is-' + x.state : '') + '" style="--i:' + i + '">' +
      '<div class="tt-time num"><b>' + esc(it.time || '--:--') + '</b>' + (it.end ? '<span>〜' + esc(it.end) + '</span>' : '') + '</div>' +
      '<span class="tt-dot" aria-hidden="true"></span>' +
      '<div class="tt-card"><div class="tt-top"><span class="tt-kind">' + KINDS[k] + '</span>' + tag + '</div>' +
      '<h3>' + esc(it.title || KINDS[k]) + '</h3>' + (it.note ? '<p>' + nl2br(it.note) + '</p>' : '') + prog + '</div></li>';
  }).join('');
  return strip + '<ol class="tt">' + list + '</ol>';
}

  var aside = d ? (d.getMonth() + 1) + '月' + d.getDate() + '日(' + '日月火水木金土'[d.getDay()] + ')' : '日付は開催日時が決まると表示されます';

/* ===== motion after render ===== */
var io = null, spy = null;
function scramble(el) {
  if (reduce) return;
  var fin = el.textContent, f = 0;
  var iv = setInterval(function () {
    f++;
    if (f > 14) { clearInterval(iv); el.textContent = fin; return; }
    el.textContent = fin.replace(/\d/g, function () { return Math.floor(Math.random() * 10); });
  }, 45);
}
function afterRender() {
  if (io) io.disconnect();
  if (spy) spy.disconnect();
  if (!('IntersectionObserver' in window)) return;
  io = new IntersectionObserver(function (es) {
    es.forEach(function (e) {
      if (!e.isIntersecting) return;
      var el = e.target;
      if (el.classList.contains('sec-h')) { el.classList.add('seen'); fxSlam(el); } else scramble(el);
      io.unobserve(el);
    });
  }, { threshold: 0.5 });
  root.querySelectorAll('.sec-h,[data-num]').forEach(function (el) { io.observe(el); });
  var navBtns = root.querySelectorAll('.nav button');
  navBtns.forEach(function (b) { b.hidden = !document.getElementById(b.dataset.go); });
  spy = new IntersectionObserver(function (es) {
    es.forEach(function (e) {
      if (!e.isIntersecting) return;
      navBtns.forEach(function (b) { b.classList.toggle('on', b.dataset.go === e.target.id); });
    });
  }, { rootMargin: '-40% 0px -55% 0px' });
  NAV.forEach(function (n) { var el = document.getElementById(n[0]); if (el) spy.observe(el); });
  tick();
}

function tick() {
  root.querySelectorAll('.count').forEach(function (c) {
    var ms = Number(c.dataset.to) - Date.now();
    if (ms < 0) ms = 0;
    var v = [Math.floor(ms / 864e5), Math.floor(ms / 36e5) % 24, Math.floor(ms / 6e4) % 60, Math.floor(ms / 1e3) % 60];
    c.querySelectorAll('b').forEach(function (b, i) { var t = pad(v[i]); if (b.textContent !== t) b.textContent = t; });
  });
}
setInterval(tick, 1000);

/* power score: 最高ランク30% 現在ランク20% トロフィー25% キャラ最高トロフィー15% 3対3勝利数10%（1000点満点） */
var TIERS = [['ブロンズ', 0], ['シルバー', 3], ['ゴールド', 6], ['ダイヤモンド', 9], ['神話', 12], ['レジェンド', 15], ['マスター', 18], ['プロ', 21]];
function rankValue(s) {
  if (!s) return null;
  s = String(s);
  for (var i = 0; i < TIERS.length; i++) {
    if (s.indexOf(TIERS[i][0]) === 0 || (TIERS[i][0] === 'レジェンド' && s.indexOf('レジェンダリー') === 0)) {
      if (TIERS[i][0] === 'プロ') return 22;
      var m = s.match(/(III|II|I|[123])\s*$/);
      var n = m ? ({ I: 1, II: 2, III: 3, '1': 1, '2': 2, '3': 3 })[m[1]] : 1;
      return TIERS[i][1] + n;
    }
  }
  return null;
}
function topTrophies(s) { var m = String(s || '').match(/([\d,]+)\s*）?\s*$/); return m ? Number(m[1].replace(/,/g, '')) : null; }
var SCORE_PARTS = [
  { key: 'rankBest', label: '最高ランク', w: 300, v: function (p) { var r = rankValue(p.rankBest); return r == null ? null : r / 22; } },
  { key: 'rank', label: '現在ランク', w: 200, v: function (p) { var r = rankValue(p.rank); return r == null ? null : r / 22; } },
  { key: 'trophies', label: 'トロフィー', w: 250, v: function (p) { return isNum(p.trophies) ? Number(p.trophies) / 70000 : null; } },
  { key: 'topBrawler', label: 'キャラ最高', w: 150, v: function (p) { var t = topTrophies(p.topBrawler); return t == null ? null : t / 2500; } },
  { key: 'wins3v3', label: '3対3勝利', w: 100, v: function (p) { return isNum(p.wins3v3) ? Number(p.wins3v3) / 6000 : null; } }
];
function powerScoreBase(p) {
  var parts = [], total = 0, known = 0;
  SCORE_PARTS.forEach(function (sp) {
    var v = sp.v(p);
    var pts = v == null ? 0 : Math.round(Math.min(1, Math.max(0, v)) * sp.w);
    if (v != null) known++;
    parts.push({ label: sp.label, pts: pts, max: sp.w, known: v != null });
    total += pts;
  });
  return known ? { total: total, parts: parts } : null;
}
function scoreTable(s) {

  var list = allPlayers(s).map(function (x) { return { pk: x.k + ':' + x.i, sc: powerScore(x.p, ctx) }; }).filter(function (x) { return x.sc; });
  list.sort(function (a, b) { return b.sc.total - a.sc.total; });
  var out = { n: list.length };
  list.forEach(function (x, i) { out[x.pk] = { total: x.sc.total, parts: x.sc.parts, place: i + 1, tour: !!x.sc.tour }; });
  return out;
}

function openDetail(pk, focusBack) {
  var html = detailHTML(view, pk);
  if (!html) return;
  if (!modalEl) {
    modalEl = document.createElement('div');
    modalEl.className = 'pm-wrap';
    document.body.appendChild(modalEl);
    modalEl.addEventListener('click', function (e) {
      if (e.target.closest('[data-close]')) return closeDetail();
      var st = e.target.closest('[data-step]');
      if (st) stepDetail(Number(st.dataset.step));
    });
  }
  if (focusBack) lastFocus = focusBack;
  modalPk = pk;
  modalEl.innerHTML = html;
  modalEl.hidden = false;
  document.documentElement.classList.add('locked');
  ss(OPEN_KEY, pk);
  var x = modalEl.querySelector('.pm-x'); if (x) x.focus({ preventScroll: true });
}
function stepDetail(d) {
  var list = allPlayers(view);
  if (!list.length) return;
  var idx = list.findIndex(function (x) { return x.k + ':' + x.i === modalPk; });
  var n = list[(idx + d + list.length) % list.length];
  openDetail(n.k + ':' + n.i);
}
function closeDetail() {
  if (!modalEl || modalEl.hidden) return;
  modalEl.hidden = true;
  modalEl.innerHTML = '';
  document.documentElement.classList.remove('locked');
  ss(OPEN_KEY, null);
  var back = lastFocus && document.contains(lastFocus) ? lastFocus : root.querySelector('[data-pk="' + modalPk + '"]');
  if (back) back.focus({ preventScroll: true });
  modalPk = '';
}
document.addEventListener('keydown', function (e) {
  if (modalEl && !modalEl.hidden) {
    if (e.key === 'Escape') { e.preventDefault(); closeDetail(); }
    else if (e.key === 'ArrowRight') stepDetail(1);
    else if (e.key === 'ArrowLeft') stepDetail(-1);
    return;
  }
  var c = e.target.closest && e.target.closest('.card[data-pk], .trk-r[data-pk]');
  if (c && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); openDetail(c.dataset.pk, c); }
});
root.addEventListener('click', function (e) {
  var c = e.target.closest('.card[data-pk], .tour-t tr[data-pk], .trk-r[data-pk]');
  if (c) openDetail(c.dataset.pk, c);
});

function startBg() {
  var c = document.getElementById('bg');
  if (!c || !c.getContext) return;
  var ctx = c.getContext('2d');
  var cs = getComputedStyle(document.documentElement);
  var BLUE = cs.getPropertyValue('--blue').trim() || '#2f9bff';
  var RED = cs.getPropertyValue('--red').trim() || '#ff3a5e';
  var GOLD = cs.getPropertyValue('--gold').trim() || '#ffcf3f';
  var W = 0, H = 0, last = 0;
  var P = [];
  for (var i = 0; i < 46; i++) P.push({ x: Math.random(), y: Math.random(), s: 0.4 + Math.random() * 1.5, v: 0.00002 + Math.random() * 0.00007, p: Math.random() * 6.28, g: Math.random() < 0.12 });
  function resize() {
    var dpr = Math.min(window.devicePixelRatio || 1, 1.5);
    W = window.innerWidth; H = window.innerHeight;
    c.width = Math.round(W * dpr); c.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (reduce) draw(0);
  }
  function draw(t) {
    ctx.clearRect(0, 0, W, H);
    var hy = H * 0.6, cx = W / 2;
    var glow = ctx.createLinearGradient(0, hy - 90, 0, hy + 30);
    glow.addColorStop(0, 'rgba(47,155,255,0)'); glow.addColorStop(0.75, 'rgba(90,108,255,0.13)'); glow.addColorStop(1, 'rgba(47,155,255,0)');
    ctx.globalAlpha = 1; ctx.fillStyle = glow; ctx.fillRect(0, hy - 90, W, 120);
    var sg = ctx.createLinearGradient(0, 0, W, 0);
    sg.addColorStop(0, BLUE); sg.addColorStop(0.5, '#6a72ff'); sg.addColorStop(1, RED);
    ctx.strokeStyle = sg; ctx.lineWidth = 1;
    ctx.globalAlpha = 0.17; ctx.beginPath();
    var N = 16, spread = Math.max(W, 700) * 1.7;
    for (var i = -N; i <= N; i++) { ctx.moveTo(cx + i * 5, hy); ctx.lineTo(cx + i * (spread / N), H); }
    ctx.stroke();
    var off = reduce ? 0.35 : (t * 0.00016) % 1;
    for (var k = 1; k < 28; k++) {
      var z = (k - off) * 0.55;
      if (z <= 0.5) continue;
      var y = hy + (H - hy) * (0.55 / z);
      if (y > H) continue;
      ctx.globalAlpha = Math.min(0.24, 0.03 + 0.28 / z);
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
    }
    for (var j = 0; j < P.length; j++) {
      var p = P[j];
      var yy = ((p.y - t * p.v) % 1 + 1) % 1 * H;
      var xx = p.x * W + Math.sin(t * 0.0004 + p.p) * 12;
      ctx.globalAlpha = 0.18 + 0.3 * (0.5 + 0.5 * Math.sin(t * 0.0015 + p.p));
      ctx.fillStyle = p.g ? GOLD : (p.x < 0.5 ? BLUE : RED);
      ctx.beginPath(); ctx.arc(xx, yy, p.s, 0, 6.283); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
  function loop(t) {
    requestAnimationFrame(loop);
    if (document.hidden || t - last < 33) return;
    last = t; draw(t);
  }
  window.addEventListener('resize', resize);
  resize();
  if (!reduce) requestAnimationFrame(loop);
}

function drawQr() {
  var box = document.getElementById('qr-out');
  if (!box) return;
  var url = (draft.meta.qrUrl || '').trim();
  if (!url) { box.innerHTML = '<p style="color:#334;text-align:center;font-size:.85rem">リンクを貼るとQRコードが出ます</p>'; return; }
  if (typeof window.qrcode !== 'function') { box.innerHTML = '<p style="color:#334;text-align:center;font-size:.85rem">QRコードの部品を読み込めませんでした。ページを開き直してください。</p>'; return; }
  var q = window.qrcode(0, 'M'); q.addData(url); q.make();
  var n = q.getModuleCount(), d = '';
  for (var r = 0; r < n; r++) for (var c = 0; c < n; c++) if (q.isDark(r, c)) d += 'M' + (c + 4) + ',' + (r + 4) + 'h1v1h-1z';
  box.innerHTML = '<svg viewBox="0 0 ' + (n + 8) + ' ' + (n + 8) + '" shape-rendering="crispEdges" role="img" aria-label="ページのQRコード"><rect width="' + (n + 8) + '" height="' + (n + 8) + '" fill="#ffffff"/><path d="' + d + '" fill="#050817"/></svg>';
}

function saveQr() {
  var out = document.getElementById('qr-msg');
  var url = (draft.meta.qrUrl || '').trim();
  if (!url || typeof window.qrcode !== 'function') { out.textContent = '先にリンクを貼ってください。'; return; }
  var q = window.qrcode(0, 'M'); q.addData(url); q.make();
  var n = q.getModuleCount(), sc = 16, size = (n + 8) * sc;
  var cv = document.createElement('canvas'); cv.width = size; cv.height = size;
  var x = cv.getContext('2d'); x.fillStyle = '#ffffff'; x.fillRect(0, 0, size, size); x.fillStyle = '#050817';
  for (var r = 0; r < n; r++) for (var c = 0; c < n; c++) if (q.isDark(r, c)) x.fillRect((c + 4) * sc, (r + 4) * sc, sc, sc);
  var use = window.claude && window.claude.use ? window.claude.use('downloads') : Promise.resolve(null);
  use.then(function (dl) {
    if (!dl) { out.textContent = 'ここでは保存できないので、QRコードをスクショしてください。'; return; }
    cv.toBlob(function (blob) {
      dl.save({ filename: 'brawl-5v5-qr.png', data: blob }).then(function (res) {
        out.textContent = res && res.status === 'saved' ? '保存しました。' : '保存先に渡しました。';
      }, function (err) {
        out.textContent = err && err.code === 'unavailable' ? 'ここでは保存できないので、スクショしてください。' : '保存しませんでした。';
      });
    }, 'image/png');
  });
}

  }, function () { setMsg('この画像は読み込めませんでした。JPEGかPNGの画像を選んでください。', 'err'); });
});

function toDataURL(file, w, h) {
  return new Promise(function (res, rej) {
    var fr = new FileReader();
    fr.onerror = rej;
    fr.onload = function () {
      var im = new Image();
      im.onerror = rej;
      im.onload = function () {
        var cv = document.createElement('canvas'); cv.width = w; cv.height = h;
        var x = cv.getContext('2d');
        var sc = Math.max(w / im.width, h / im.height), sw = w / sc, sh = h / sc;
        x.drawImage(im, (im.width - sw) / 2, (im.height - sh) / 2, sw, sh, 0, 0, w, h);
        res(cv.toDataURL('image/jpeg', 0.74));
      };
      im.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

adminRoot.addEventListener('click', function (e) {
  var t = e.target.closest('[data-tab],[data-act]');
  if (!t) return;
  if (t.dataset.tab) { tab = t.dataset.tab; armed = ''; renderAdmin(); var b = document.querySelector('.dr-b'); if (b) b.scrollTop = 0; return; }
  var act = t.dataset.act;
  if (act === 'open') return openAdmin();
  if (act === 'close') { adminOpen = false; armed = ''; renderAdmin(); return; }
  if (act === 'arm') { armed = t.dataset.key; renderAdmin(); return; }
  if (act === 'disarm') { armed = ''; renderAdmin(); return; }
  if (act === 'saveqr') return saveQr();
  if (act === 'publish') return doPublish();
  if (act === 'restore') { draft = mergeStats(clone(offer.data), PUBLISHED); offer = null; touched(); renderAdmin(); return; }
  if (act === 'discard') { offer = null; ss(PENDING_KEY, null); ls(DRAFT_KEY, null); renderAdmin(); return; }
  if (act === 'revert') { draft = clone(PUBLISHED); dirty = false; armed = ''; ls(DRAFT_KEY, null); view = PUBLISHED; render(); setMsg('編集を取り消しました。'); renderAdmin(); return; }
  if (act === 'archive') { doArchive(); armed = ''; touched(); renderAdmin(); setMsg('「過去の大会」に保存しました。公開すると反映されます。'); return; }
  if (act === 'clearimg') { setPath(draft, t.dataset.path, ''); touched(); renderAdmin(); return; }
  var lp = t.dataset.list;
  if (!lp) return;
  var list = getPath(draft, lp), i = Number(t.dataset.i);
  if (act === 'add') { if (lp === 'faq') list.unshift(TPL[t.dataset.tpl]()); else list.push(TPL[t.dataset.tpl]()); }
  if (act === 'del') list.splice(i, 1);
  if (act === 'up' && i > 0) list.splice(i - 1, 0, list.splice(i, 1)[0]);
  if (act === 'down' && i < list.length - 1) list.splice(i + 1, 0, list.splice(i, 1)[0]);
  armed = '';
  touched(); renderAdmin();
});

var AUTO = ['trophies', 'trophiesPrev', 'highest', 'wins3v3', 'rank', 'rankBest', 'brawlers', 'level', 'club', 'topBrawler'];
function mergeStats(d, live) {
  var la = parseDate(live.meta.statsAt), da = parseDate(d.meta.statsAt);
  if (!la || (da && da >= la)) return d;
  var byTag = {};
  ['blue', 'red'].forEach(function (k) { (live.teams[k].members || []).forEach(function (p) { if (p.tag) byTag[p.tag.trim().toUpperCase()] = p; }); });
  ['blue', 'red'].forEach(function (k) {
    (d.teams[k].members || []).forEach(function (p) {
      var l = p.tag && byTag[p.tag.trim().toUpperCase()];
      if (l) AUTO.forEach(function (f) { if (f in l) p[f] = l[f]; });
    });
  });
  d.meta.statsAt = live.meta.statsAt;
  if (live.meta.syncLog) d.meta.syncLog = live.meta.syncLog;
  return d;
}

function doPublish() {
  if (busy || !draft) return;
  busy = true; setMsg('公開しています…'); renderAdmin();
  var use = window.claude && window.claude.use ? window.claude.use('artifact') : Promise.resolve(null);
  use.then(function (art) {
    if (!art) throw { code: 'not_granted' };
    var next = mergeStats(clone(draft), PUBLISHED);
    next.updatedAt = new Date().toISOString();
    ss(PENDING_KEY, { at: next.updatedAt, data: next });
    return art.publish(buildDocument(next));
  }).then(function () {
    ls(DRAFT_KEY, null);
    setMsg('公開しました。ページを読み込み直します…', 'ok');
  }, function (err) {
    busy = false;
    var c = err && err.code;
    var text = {
      conflict: '別の画面で先に公開されたので、ページを読み込み直します。読み込み後に「続きから編集」で戻せます。',
      not_writer: 'このアカウントでは公開できません。ページを作った本人のアカウントで開いてください。',
